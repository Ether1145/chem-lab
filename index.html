<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>化学虚拟实验室 v3 · 拖拽实验台</title>
<style>
:root{
  --bg:#060f1a; --panel:#0d1b2b; --panel2:#112338; --line:#1d3449;
  --text:#e9f2fb; --muted:#8ba5bd; --dim:#5d7893;
  --accent:#3fd6a4; --accent-dim:rgba(63,214,164,.12);
  --blue:#5aa9ff; --violet:#a98bff; --warn:#e6b03d; --danger:#e0655f;
  --radius:16px; --shadow:0 18px 44px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);background:
    radial-gradient(1200px 600px at 8% -12%, #10263d 0%, transparent 58%),
    radial-gradient(900px 520px at 102% -4%, #122a3c 0%, transparent 55%),
    var(--bg);
  font:14.5px/1.6 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)} .small{font-size:12px} .dim{color:var(--dim)}
[hidden]{display:none!important}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(13,27,43,.92),rgba(8,18,30,.7));backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#062015;
  background:linear-gradient(135deg,#5be0b3,#28a9ff);box-shadow:0 6px 20px rgba(56,200,180,.35);flex:0 0 auto}
.brand h1{font-size:17px;letter-spacing:.02em;line-height:1.2}
.brand p{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topstats{display:flex;gap:14px;margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.topstats b{color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums;margin-right:2px}
.topactions{display:flex;gap:8px;margin-left:auto}
.topstats + .topactions{margin-left:18px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;
  padding:6px 12px;font-size:12.5px;transition:.15s}
.ghost:hover{color:var(--text);border-color:#355573;background:#0e2033}

/* ---------- 布局 ---------- */
.app{display:grid;grid-template-columns:296px minmax(0,1fr) 352px;gap:16px;
  padding:16px 18px 40px;align-items:start;max-width:1680px;margin:0 auto}
.panel{background:linear-gradient(180deg,rgba(17,35,56,.9),rgba(11,24,39,.94));
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{font-size:14.5px;font-weight:700;letter-spacing:.01em}
.left{position:sticky;top:80px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin}
.left::-webkit-scrollbar,.bottles::-webkit-scrollbar,.log::-webkit-scrollbar{width:7px}
.left::-webkit-scrollbar-thumb,.bottles::-webkit-scrollbar-thumb,.log::-webkit-scrollbar-thumb{background:#213b53;border-radius:8px}
.right{min-height:420px}

/* ---------- 仪器 ---------- */
.appar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.appar{background:#091726;border:1px solid var(--line);border-radius:11px;padding:6px 3px 4px;
  text-align:center;cursor:grab;transition:.13s;user-select:none;touch-action:none}
.appar:hover{border-color:rgba(63,214,164,.5);background:#0d2133;transform:translateY(-1px)}
.appar svg{display:block;width:100%;height:42px;margin:0 auto}
.appar span{display:block;font-size:10.5px;color:#a7bdd1;margin-top:1px;white-space:nowrap}

/* ---------- 试剂 ---------- */
.searchrow{display:flex;gap:8px}
.search{width:100%;background:#081624;border:1px solid var(--line);border-radius:10px;color:var(--text);
  padding:8px 11px;font:inherit;font-size:13px;outline:none;margin-bottom:9px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search::placeholder{color:#56718b}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#081726;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:3px 9px;font-size:11px;cursor:pointer;transition:.13s;user-select:none}
.chip:hover{color:var(--text);border-color:#2f4d68}
.chip.on{background:var(--accent-dim);border-color:rgba(63,214,164,.55);color:var(--accent);font-weight:600}
.dosebar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.bottles{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:300px;overflow:auto;padding-right:2px}
.bottle{display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid var(--line);border-radius:9px;
  background:#081726;cursor:pointer;transition:.12s;font-size:11.5px;min-width:0;touch-action:none}
.bottle:hover{background:#0c2134;border-color:#31526e}
.bottle.sel{border-color:var(--accent);background:rgba(63,214,164,.1);box-shadow:0 0 0 2px var(--accent-dim)}
.bottle .cap{width:8px;height:17px;border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.bottle .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottle .bf{margin-left:auto;color:#5f7a94;font-size:10px;flex:0 0 auto}
.tip{margin-top:9px;font-size:11px;color:#5f7a94;line-height:1.55}

/* ---------- 实验台 ---------- */
.center{min-width:0}
.bench-panel{padding-bottom:12px}
.bench{position:relative;height:560px;border-radius:14px;overflow:hidden;border:1px solid #203a52;
  background:linear-gradient(180deg,#0b1a2a 0%,#0a1626 58%,#081220 100%);touch-action:none}
.bench-bg{position:absolute;inset:0;background:
  radial-gradient(600px 220px at 50% 0%,rgba(80,180,220,.08),transparent 70%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 56px);pointer-events:none}
.tabletop{position:absolute;left:0;right:0;bottom:0;height:96px;
  background:linear-gradient(180deg,#1a3044,#0c1a29 72%);border-top:2px solid #2f5472;
  box-shadow:inset 0 12px 26px rgba(0,0,0,.42);pointer-events:none}
.tabletop::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 64px)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#vessels{position:absolute;inset:0;z-index:4}
#vessels .vessel{z-index:3}
#vessels .vessel.source{z-index:2}
#vessels .vessel.source.source-behind{z-index:1}
#vessels .vessel.source[data-type="lamp"].under{z-index:4}
.bench-empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
  color:#4d6b86;font-size:13.5px;pointer-events:none;text-align:center;padding:0 30px}

.vessel{position:absolute;cursor:grab;touch-action:none;user-select:none}
.vessel:active{cursor:grabbing}
.vessel .glass{position:relative;width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.42))}
.vessel svg{display:block;width:100%;height:100%;overflow:visible}
.vessel.sel::before{content:"";position:absolute;inset:-7px;border:1px dashed rgba(63,214,164,.65);
  border-radius:14px;pointer-events:none;z-index:7}
.vessel .vlabel{position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;white-space:nowrap;
  font-size:10.5px;color:#93aec5;background:rgba(6,15,26,.82);padding:1px 7px;border-radius:6px;pointer-events:none}
.vessel .vcont{display:none}
.vessel .rm{position:absolute;top:-9px;right:-9px;width:21px;height:21px;border-radius:50%;border:1px solid #2c4a66;
  background:#0a1a2b;color:#7f9ab2;font-size:11px;line-height:1;padding:0;display:none;z-index:8}
.vessel:hover .rm{display:block}
.vessel .rm:hover{color:var(--danger);border-color:var(--danger)}
.vessel.heat .glass{filter:drop-shadow(0 0 16px rgba(255,120,50,.4)) drop-shadow(0 12px 18px rgba(0,0,0,.42))}
.vessel.silver .glass{filter:brightness(1.14) contrast(1.05) drop-shadow(0 0 14px rgba(235,242,255,.7)) drop-shadow(0 12px 18px rgba(0,0,0,.42))}
.vessel .flame-wrap{position:absolute;left:50%;transform:translate(-50%,-100%);pointer-events:none;display:none;z-index:5}
.vessel.lit .flame-wrap{display:block}
.flame{display:block;width:30px;height:48px;border-radius:52% 52% 46% 46%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 76%,#fffbe0 0%,var(--flame,#ffc447) 42%,rgba(255,255,255,0) 100%);
  filter:blur(.3px) drop-shadow(0 0 7px var(--flame,#ffc447));animation:flick .5s infinite alternate ease-in-out}
@keyframes flick{from{transform:scale(1,1) translateY(0);opacity:.9}to{transform:scale(.9,1.12) translateY(-2px);opacity:1}}
.vessel .heatwave{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:60%;height:22px;
  background:radial-gradient(50% 100% at 50% 100%,rgba(255,170,70,.35),transparent 70%);filter:blur(3px);
  display:none;pointer-events:none}
.vessel.heat .heatwave{display:block}

/* SVG 内部 */
.glass-line{fill:rgba(150,205,255,.06);stroke:#6289ab;stroke-width:3}
.glass-line2{fill:none;stroke:#3f5f7c;stroke-width:2}
.shine{stroke:rgba(255,255,255,.2);stroke-width:3;stroke-linecap:round}
.liq-aq,.liq-org{transition:y .35s ease,height .35s ease,fill .5s ease,opacity .35s}
.liq-top{transition:y .35s ease,height .35s ease,opacity .35s}
.ppt-layer{transition:y .3s,height .3s,fill .4s}
.crystal{transition:r .3s,opacity .3s}
.gas-fill{transition:opacity .5s,fill .5s}
.glass-text{font-size:9px;fill:#7f9cb5;font-family:inherit}

/* ---------- 工具栏 ---------- */
.toolbar{margin-top:11px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sel-hint{font-size:12px;color:var(--muted);flex:1 1 220px;min-width:0}
.sel-hint.warn{color:var(--warn)}
.sel-hint b{color:var(--text);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{background:#0a1a2b;border:1px solid var(--line);color:#b9cde0;border-radius:9px;padding:6px 10px;
  font-size:12px;transition:.13s;white-space:nowrap}
.tool:hover:not(:disabled){border-color:#355a78;background:#0e2337;color:var(--text)}
.tool:disabled{opacity:.35;cursor:default}
.tool.on{color:var(--accent);border-color:rgba(63,214,164,.55);background:var(--accent-dim)}
.tool.danger:hover{color:var(--danger);border-color:var(--danger)}

/* ---------- 信息面板 ---------- */
.info-empty,.log-empty{color:#57728c;font-size:12.5px;line-height:1.7;padding:4px 2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.metric{background:#0a1a2b;border:1px solid var(--line);border-radius:11px;padding:7px 9px}
.metric b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.25}
.metric span{font-size:10.5px;color:var(--muted)}
.metric.good b{color:var(--accent)} .metric.warn b{color:var(--warn)}
.contents{display:grid;gap:5px;max-height:220px;overflow:auto;padding-right:2px}
.citem{display:flex;align-items:center;gap:7px;padding:4px 7px;border:1px solid #172d42;border-radius:8px;background:#081726;font-size:11.5px}
.citem .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.citem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.citem .fm{color:#6f8da6;font-size:10.5px;flex:0 0 auto}
.citem .mol{margin-left:auto;color:#a9c4da;font-variant-numeric:tabular-nums;flex:0 0 auto}
.state-tag{font-size:9.5px;border-radius:5px;padding:0 5px;border:1px solid #24405a;color:#8ba5bd;flex:0 0 auto}
.state-tag.gas{color:#8fd6ff;border-color:#22506e}.state-tag.precipitate{color:#ffb38a;border-color:#5d3a2a}
.state-tag.ion{color:#c9a7ff;border-color:#43305e}
.mini-hint{margin-top:9px;font-size:11.5px;color:var(--warn);line-height:1.55}

/* ---------- 日志 ---------- */
.log{display:grid;gap:9px;max-height:520px;overflow:auto;padding-right:2px}
.entry{border:1px solid #1d3a30;border-radius:12px;padding:9px 11px;
  background:linear-gradient(180deg,rgba(63,214,164,.055),rgba(10,22,36,.55))}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.entry .eh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.entry .eh h3{font-size:13px;font-weight:650}
.entry .where{margin-left:auto;font-size:10px;color:#718ea7}
.tag{font-size:10px;border-radius:5px;padding:0 6px;line-height:1.7;border:1px solid #26445e;color:#a2bccf;background:#0d2235;white-space:nowrap}
.tag.type{color:var(--blue);border-color:rgba(90,169,255,.35);background:rgba(90,169,255,.1)}
.tag.cond{color:#e6c983;border-color:rgba(230,176,61,.3)}
.entry .eq{white-space:normal;overflow-x:visible;word-break:break-word}
.eq{margin:5px 0 6px;padding:6px 9px;background:#061320;border:1px solid #17304a;border-radius:8px;
  font-family:"Cascadia Mono",Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:nowrap}
.eq .arrow{color:var(--accent);font-weight:700;margin:0 4px}
.eq sub{font-size:.72em}
.phe{margin:0;padding-left:14px;font-size:11.5px;color:#c6d8e8;display:grid;gap:2px}
.phe li::marker{color:var(--accent)}
.entry .amt{font-size:10.5px;color:#7f9bb3;margin-top:5px}
.entry .edu{margin-top:5px;padding:4px 8px;border-left:2px solid rgba(63,214,164,.45);background:rgba(63,214,164,.045);
  color:#a9c1d4;font-size:10.5px;border-radius:0 6px 6px 0}

/* ---------- 浮标、拖拽、提示 ---------- */
.fxnote{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;padding:3px 9px;
  border-radius:999px;border:1px solid rgba(63,214,164,.55);background:rgba(7,18,30,.95);color:#e6f2fb;
  pointer-events:none;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.45);animation:noteIn .2s ease-out}
.fxnote.out{opacity:0;transition:opacity .6s ease}
@keyframes noteIn{from{opacity:0;transform:translate(-50%,-85%)}to{opacity:1;transform:translate(-50%,-100%)}}
.ghost-drag{position:fixed;z-index:99;pointer-events:none;opacity:.8;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55))}
.ghost-drag svg{width:100%;height:100%;display:block}
.ghost-drag .gcap{width:100%;height:100%;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.carry{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:65;display:flex;flex-wrap:nowrap;align-items:center;gap:8px;width:max-content;
  background:rgba(10,25,40,.96);border:1px solid rgba(63,214,164,.55);border-radius:12px;padding:7px 11px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);font-size:12.5px;max-width:92vw}
.carry-dot{width:10px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:0 0 auto}
.carry b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.carry .carry-tip{color:var(--muted);font-size:11.5px}
.carry button{padding:3px 9px;font-size:11.5px;border-radius:7px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);width:max-content;background:#102336;border:1px solid rgba(63,214,164,.5);
  color:var(--text);padding:8px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 16px 40px rgba(0,0,0,.5);
  z-index:70;max-width:88vw}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(3,9,16,.72);backdrop-filter:blur(5px);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:18px}
.modal-card{width:min(760px,100%);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#112338,#0b1a2b);
  border:1px solid #27435d;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:16px 18px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-head h3{font-size:16px}
.modal-body{font-size:13px}
.ref-row{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;margin-bottom:12px}
.ref-row select{width:100%;background:#081726;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:inherit;font-size:12.5px;outline:none}
.ref-plus{color:var(--muted);text-align:center}
.ref-btn{background:var(--accent);color:#062015;border:0;border-radius:9px;padding:8px 14px;font-weight:650;font-size:12.5px}
.ref-result{display:grid;gap:8px;margin-top:10px}
.ref-card{border:1px solid #1c354b;border-radius:10px;padding:8px 10px;background:#081726}
.ref-card .eq{margin:4px 0}
.ref-card .meta{font-size:10.5px;color:var(--muted)}
.ref-empty{color:#607d96;font-size:12px;padding:10px 2px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.demo-card{border:1px solid #1f3a52;border-radius:10px;padding:9px 10px;background:#081726}
.demo-card h4{margin:0 0 3px;font-size:12.5px}
.demo-card p{margin:0 0 7px;font-size:10.8px;color:#8ba5bd;line-height:1.5;min-height:32px}
.demo-card button{padding:3px 9px;font-size:11px;border-radius:7px}
@media(max-width:560px){.demo-grid{grid-template-columns:1fr}}
.help p{margin:0 0 8px;color:#bbcede;font-size:12.5px}
.help b{color:var(--accent)}
.help ul{margin:0 0 10px;padding-left:18px;color:#a9c2d6;font-size:12px;display:grid;gap:4px}

/* ---------- 响应式 ---------- */
@media (max-width:1280px){
  .app{grid-template-columns:280px minmax(0,1fr)}
  .right{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
  .right .info-wrap{min-width:0}
}
@media (max-width:900px){
  .topbar{flex-wrap:wrap;gap:10px;padding:12px 14px}
  .brand p{display:none}
  .topstats{order:3;width:100%;justify-content:space-between;margin:0}
  .topactions{margin-left:auto}
  .app{grid-template-columns:minmax(0,1fr);padding:12px 12px 30px;gap:12px}
  .left{position:static;max-height:none;order:3}
  .center{order:1}
  .right{order:2;display:block}
  .bench{height:480px}
  .appar-grid{grid-template-columns:repeat(5,1fr)}
  .bottles{grid-template-columns:1fr 1fr;max-height:260px}
  .metrics{grid-template-columns:repeat(4,1fr)}
  .toolbar{align-items:flex-start}
}
@media (max-width:560px){
  .brand h1{font-size:15px}
  .bench{height:420px}
  .appar-grid{grid-template-columns:repeat(3,1fr)}
  .bottles{grid-template-columns:1fr 1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .ref-row{grid-template-columns:1fr;gap:6px}
  .ref-plus{display:none}
  .tool{padding:5px 8px;font-size:11px}
  .log{max-height:380px}
}

/* 条件仪器状态 */
.vessel.source{cursor:pointer}
.vessel.source .vlabel{color:#9fc0d8;bottom:-17px;top:auto;display:block}
.vessel.source.under .vlabel{display:none}
.vessel.source.on .src-dot{fill:#4be0a0}
.vessel.source.on .wb-water{fill:rgba(120,220,255,.42)}
.vessel.source.on .furn-glow{fill:rgba(255,110,30,.62)}
.vessel.source.on .uv-glow{opacity:.95}
.vessel.source.on .glass{filter:drop-shadow(0 0 14px rgba(120,220,255,.25)) drop-shadow(0 12px 18px rgba(0,0,0,.42))}
.vessel.source.on[data-type="uvlamp"] .glass{filter:drop-shadow(0 0 20px rgba(150,120,255,.55)) drop-shadow(0 12px 18px rgba(0,0,0,.42))}
.vessel.source.lit .glass{filter:drop-shadow(0 0 20px rgba(255,160,60,.4)) drop-shadow(0 12px 18px rgba(0,0,0,.42))}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">⌬</span>
    <div>
      <h1>化学虚拟实验室</h1>

<main class="app">
  <aside class="panel left" id="left">
    <div class="ph"><h2>仪器台</h2><span class="muted small">拖到实验台</span></div>
    <div id="apparatus" class="appar-grid"></div>

    <div class="ph" style="margin-top:16px"><h2>试剂柜</h2><span class="muted small" id="bottle-count"></span></div>
    <div class="searchrow">
      <input id="search" class="search" type="search" placeholder="搜索名称 / 化学式 / 别名…" autocomplete="off">
    </div>
    <div id="kinds" class="chips"></div>
    <div class="dosebar">
      <span class="muted small">取用量</span>
      <div id="doses" class="chips"></div>
    </div>
    <div id="bottles" class="bottles"></div>
    <p class="tip">点试剂瓶拿起，再点仪器倒入；固体先加进仪器，再加蒸馏水溶解。</p>
  </aside>

  <section class="center">
    <div class="bench-panel panel">
      <div class="ph">
        <h2>实验台</h2>
        <div class="ph-right">
          <span id="bench-hint" class="muted small">把仪器拖进来，再把试剂拖到仪器上</span>
          <button id="btn-demo" class="ghost" type="button">示例实验</button>
        </div>
      </div>
      <div id="bench" class="bench">
        <div class="bench-bg"></div>
        <div class="tabletop"></div>
        <div id="vessels"></div>
        <canvas id="fx"></canvas>
        <div id="bench-empty" class="bench-empty">
          <span>把「试管」「烧杯」「锥形瓶」拖到这里</span>
          <span class="muted small">再从左边拖试剂瓶过来，或点瓶子再点仪器</span>
        </div>
      </div>
      <div class="toolbar">
        <div id="sel-hint" class="sel-hint">未选中仪器</div>
        <div class="tools">
          <button id="btn-ignite" class="tool" type="button" disabled title="用燃着的木条点燃/熄灭">🔥 点燃</button>
          <button id="btn-stir" class="tool" type="button" disabled title="用玻璃棒搅拌 3 秒">🥢 搅拌</button>
          <button id="btn-empty" class="tool" type="button" disabled title="倒掉内容物">🗑 倒掉</button>
          <button id="btn-clean" class="tool" type="button" disabled title="洗净仪器">💧 清洗</button>
          <button id="btn-remove" class="tool" type="button" disabled title="移走仪器">✕ 移除</button>
          <button id="btn-clear" class="tool danger" type="button">清空台面</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel right">
    <div class="ph"><h2 id="info-title">仪器信息</h2><span id="info-sub" class="muted small"></span></div>
    <div id="info" class="info">
      <div class="info-empty">点选一台仪器，查看它的温度、体积、pH 和内容物。</div>
    </div>

    <div class="ph" style="margin-top:16px"><h2>反应记录</h2><span id="log-count" class="muted small"></span></div>
    <div id="log" class="log">
      <div class="log-empty">还没有反应。试试：稀盐酸 + 碳酸钙，或者硫酸铜溶液 + 氢氧化钠。</div>
    </div>
  </aside>
</main>

        kind: singleSolid ? 'solid' : 'crystal',
        sid: singleSolid ? comp[0].s : null,
        comp: singleSolid ? null : comp.map(function (c) { return { s: c.s, n: c.n }; }),
        mol: a.mol,
        units: a.mol,
        initial: a.mol,
        dissolved: 0,
        sol: r.sol || (singleSolid ? 'insoluble' : 'slight'),
        color: r.color || (singleSolid ? sp(comp[0].s).color : null) || '#dfe7f2',
        name: r.name, formula: r.formula, reagentId: rid,
        density: r.density || null
      };
      v.solids.push(entry);
      (r.tags || []).forEach(function (t) { v.tags[t] = true; });
      if (/钠|钾|钙/.test(r.name) && /单质/.test(r.kind)) { /* 活泼金属 */ }
      return { ok: true, mol: a.mol, msg: '加入 ' + a.mass.toFixed(2) + ' g ' + r.name };
    }
    // 液体 / 溶液
    var cur = totalVolume(v);
    var ml = a.ml;
    var room = Math.max(0, v.capacity - cur);
    var scaled = false;
    if (ml > room) {
      if (room < 0.05) return { ok: false, why: '仪器已经满了，先倒掉一些' };
      a.mol *= room / ml; ml = room; scaled = true;
    }
    v.pool.H2O = (v.pool.H2O || 0) + waterIn(r, ml);
    (r.composition || []).forEach(function (c) {
      var sid = c.s;
      var n = c.n * a.mol;
      var s = sp(sid);
      if (s.phase === 'solid') {
        v.solids.push({ kind: 'ppt', sid: sid, mol: n, initial: n, sol: 'insoluble', color: s.color || '#eef2f7', name: s.name });
      } else {
        v.pool[sid] = (v.pool[sid] || 0) + n;
      }
    });
    (r.tags || []).forEach(function (t) { v.tags[t] = true; });
    return {
      ok: true, mol: a.mol, msg: '加入 ' + ml.toFixed(ml < 1 ? 2 : 1) + ' mL ' + r.name + (scaled ? '（仪器已满，只倒进一部分）' : '')
    };
  }

  /* ---------------- 体积、颜色、分层 ---------------- */
  function speciesVolumeMl(sid, mol) {
    var s = sp(sid);
    if (s.phase === 'gas') return 0;
    if (s.ionic) return mol * 12; // 离子对体积的贡献（近似）
    var M = s.molarMass || 60;
    var d = s.density || 1;
    return mol * M / d;
  }

  function volumes(v) {
    var aq = 0, org = 0;
    for (var sid in v.pool) {
      var s = sp(sid);
      var ml = speciesVolumeMl(sid, v.pool[sid]);
      if (sid === 'H2O' || s.ionic || s.misc || s.phase === 'aq' || s.phase === 'aqueous') aq += ml;
      else org += ml;
    }
    return { aq: Math.max(0, aq), org: Math.max(0, org), total: Math.max(0, aq + org) };
  }
  function totalVolume(v) { var x = volumes(v); return x.total; }

  function hex2rgb(h) {
    h = String(h || '').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return isNaN(n) ? [210, 228, 240] : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(colors) {
    if (!colors.length) return null;
    var r = 0, g = 0, b = 0, w = 0;
    colors.forEach(function (c) {
      var rgb = hex2rgb(c[0]), k = Math.max(0.02, c[1]);
      r += rgb[0] * k; g += rgb[1] * k; b += rgb[2] * k; w += k;
    });
    return '#' + [r / w, g / w, b / w].map(function (x) {
      return ('0' + Math.round(x).toString(16)).slice(-2);
    }).join('');
  }

  function indicatorColor(v) {
    var p = ph(v);
    if ((v.pool['phenolphthalein(m)'] || 0) > 1e-9) {
      return p > 8.2 ? '#e5326e' : null;
    }
    if ((v.pool['litmus(m)'] || 0) > 1e-9) {
      return p < 5 ? '#d24a4a' : (p > 8 ? '#3f6fd8' : '#7b3fbf');
    }
    if ((v.pool['methylorange(m)'] || 0) > 1e-9) {
      return p < 3.1 ? '#e04a4a' : (p > 4.4 ? '#e8c33a' : '#e58a3a');
    }
    return null;
  }

  function solutionColor(v) {
    var ind = indicatorColor(v);
    if (ind) return ind;
    var cols = [];
    for (var sid in v.pool) {
      var s = sp(sid);
      if (sid === 'H2O' || !s.color) continue;
      var w = v.pool[sid] * (s.ionic ? 6 : 1);
      cols.push([s.color, w]);
    }
    return mix(cols);
  }

  function layers(v) {
    var vol = volumes(v);
    var out = [];
    var aqCol = solutionColor(v);
    var orgCols = [], aqParts = [];
    for (var sid in v.pool) {
      var s = sp(sid);
      if (sid === 'H2O' || !s.color) continue;
      if (s.ionic || s.misc || s.phase === 'aq' || s.phase === 'aqueous') aqParts.push([s.color, v.pool[sid]]);
      else orgCols.push([s.color, v.pool[sid]]);
    }
    var aqColor = indicatorColor(v) || mix(aqParts) || '#dceaf5';
    var orgColor = mix(orgCols) || '#e6d7b0';
    if (vol.aq > 0.01) out.push({ phase: 'aq', ml: vol.aq, color: aqColor, density: 1 + Math.min(0.15, (v.pool.H2O ? 0 : 0)) });
    if (vol.org > 0.01) {
      var od = 0, ow = 0;
      for (var sid2 in v.pool) {
        var s2 = sp(sid2);
        if (s2.ionic || s2.misc || s2.phase === 'gas') continue;
        var ml2 = speciesVolumeMl(sid2, v.pool[sid2]);
        od += (s2.density || 1) * ml2; ow += ml2;
      }
      od = ow > 0 ? od / ow : 1;
      out.push({ phase: 'org', ml: vol.org, color: orgColor, density: Math.max(0.6, Math.min(2.2, od)) });
    }
    out.sort(function (a, b) { return b.density - a.density; }); // 重的在下
    return out;
  }

  function ph(v) {
    var vol = volumes(v), L = Math.max(0.01, vol.aq / 1000);
    var h = (v.pool['H+'] || 0) / L, oh = (v.pool['OH-'] || 0) / L;
    if (h > oh) return Math.max(0, Math.min(14, -Math.log10(h)));
    if (oh > h) return Math.max(0, Math.min(14, 14 + Math.log10(oh)));
    return 7;
  }

  /* ---------------- 条件 ---------------- */
  function has(v, sid) { return (v.pool[sid] || 0) > EPS; }

  function condSet(v) {
    var c = {};
    if (v.temp >= 55) c['加热'] = true;
    if (v.temp >= 380) c['高温'] = true;
    if (v.temp >= 128) c['油浴140'] = true;
    if (v.temp >= 158) c['油浴170'] = true;
    if (v.ignited) c['点燃'] = true;
    if (v.light) c['光照'] = true;
    if (v.waterbath && v.temp >= 85) c['水浴加热'] = true;
    for (var t in v.tags) c[t] = true;
    if (has(v, 'Na+') && has(v, 'OH-')) c['NaOH溶液'] = true;
    if (has(v, 'H+') && has(v, 'Cl-') && !v.tags.concHCl) c['稀盐酸'] = true;
    if (has(v, 'H+') && has(v, 'SO4^2-') && !v.tags.concH2SO4) c['稀硫酸'] = true;
    if (has(v, 'H+') && has(v, 'NO3-') && !v.tags.concHNO3) c['稀硝酸'] = true;
    if (has(v, 'Br2') && has(v, 'H2O')) c['溴水'] = true;
    if (has(v, 'Cl2') && has(v, 'H2O')) c['氯水'] = true;
    if (has(v, 'H+') && (has(v, 'Cl-') || has(v, 'SO4^2-'))) c['稀酸'] = true;
    if (v.tags['催化剂'] || v.tags['catalyst']) c['催化剂'] = true;
    if ((v.pool.H2O || 0) < 0.005) c['无水'] = true;
    return c;
  }

  function crystalIons(v, sid) {
    var n = 0;
    for (var i = 0; i < v.solids.length; i++) {
      var x = v.solids[i];
      if (!x.comp) continue;
      for (var j = 0; j < x.comp.length; j++) {
        if (x.comp[j].s === sid) n += x.comp[j].n * x.mol;
      }
    }
    return n;
  }

  function availableFor(v, r, sid) {
    var n = available(v, sid);
    if (n > EPS) return n;
    if ((r.conditions || []).indexOf('无水') >= 0) n += crystalIons(v, sid);
    return n;
  }

  function available(v, sid) {
    var s = sp(sid), n = 0;
    n += v.pool[sid] || 0;
    n += v.gases[sid] || 0;
    for (var i = 0; i < v.solids.length; i++) {
      var x = v.solids[i];
      if (x.sid === sid) n += x.mol;
    }
    if (sid === 'O2' && v.ignited && v.open) n = Math.max(n, 0.004);
    return n;
  }

  function canRun(v, r, conds) {
    if (r.conditions && r.conditions.length) {
      for (var i = 0; i < r.conditions.length; i++) if (!conds[r.conditions[i]]) return false;
    }
    var water = (v.pool.H2O || 0) > 1e-5;
    var dryRule = (r.conditions || []).indexOf('无水') >= 0;
    for (var j = 0; j < r.need.length; j++) {
      var it = r.need[j];
      var s = sp(it.s);
      if (s.ionic && !water && !dryRule) return false;
      if (availableFor(v, r, it.s) < it.n * 1e-5) return false;
    }
    return true;
  }

  /* ---------------- 结算 ---------------- */
  function take(v, sid, n, allowSolid) {
    var s = sp(sid), left = n;
    function fromPool() {
      var p = v.pool[sid] || 0, d = Math.min(p, left);
      if (d > 0) { v.pool[sid] = p - d; left -= d; if (v.pool[sid] < EPS) delete v.pool[sid]; }
    }
    function fromSolid() {
      for (var i = v.solids.length - 1; i >= 0 && left > EPS; i--) {
        var x = v.solids[i];
        if (x.sid !== sid) continue;
        var d = Math.min(x.mol, left);
        x.mol -= d; left -= d;
        if (x.mol < EPS) v.solids.splice(i, 1);
      }
    }
    function fromGas() {
      var p = v.gases[sid] || 0, d = Math.min(p, left);
      if (d > 0) { v.gases[sid] = p - d; left -= d; if (v.gases[sid] < EPS) delete v.gases[sid]; }
    }
    function fromCrystal() {
      for (var i = v.solids.length - 1; i >= 0 && left > EPS; i--) {
        var x = v.solids[i];
        if (!x.comp) continue;
        for (var j = 0; j < x.comp.length && left > EPS; j++) {
          var c = x.comp[j];
          if (c.s !== sid || !c.n) continue;
          var avail = c.n * x.mol;
          var d = Math.min(avail, left);
          x.mol -= d / c.n;
          left -= d;
        }
        if (x.mol < EPS) v.solids.splice(i, 1);
      }
    }
    if (s.phase === 'solid') { fromSolid(); fromPool(); }
    else if (s.phase === 'gas') { fromGas(); fromPool(); }
    else { fromPool(); fromSolid(); fromGas(); }
    if (allowSolid) fromCrystal();
    return n - left;
  }

  function put(v, sid, n) {
    var s = sp(sid);
    if (s.phase === 'gas') {
      v.gases[sid] = (v.gases[sid] || 0) + n;
      return;
    }
    if (s.phase === 'solid') {
      for (var i = 0; i < v.solids.length; i++) {
        var x = v.solids[i];
        if (x.sid === sid && x.kind === 'ppt') { x.mol += n; return; }
      }
      v.solids.push({ kind: 'ppt', sid: sid, mol: n, initial: n, sol: 'insoluble',
        color: s.color || '#e9eff5', name: s.name, density: s.density || null });
      return;
    }
    v.pool[sid] = (v.pool[sid] || 0) + n;
  }

  function execute(v, r, extent, events) {
    var allowSolid = (r.conditions || []).indexOf('无水') >= 0;
    for (var i = 0; i < r.need.length; i++) take(v, r.need[i].s, r.need[i].n * extent, allowSolid);
    for (var j = 0; j < r.give.length; j++) put(v, r.give[j].s, r.give[j].n * extent);
    var heat = (r.fx && r.fx.heat) ||
      ((r.conditions || []).indexOf('点燃') >= 0 ? 600 :
        ({ '中和': 57, '燃烧': 600, '化合': 60, '氧化还原': 120, '置换': 90, '分解': 30 })[r.type]) || 20;
    var volL = Math.max(0.015, totalVolume(v) / 1000);
    v.temp = Math.min(800, v.temp + heat * extent / (4.18 * volL));
    var rec = v.active[r.id] || (v.active[r.id] = { rule: r, extent: 0, t: 0 });
    rec.extent += extent; rec.t = Date.now();
    if (events) events.push({ rule: r, extent: extent });
  }

  function runReactions(v, dt, events) {
    var conds = condSet(v);
    var passes = 0, progressed = true;
    var hasWater = (v.pool.H2O || 0) > 1e-5;
    while (progressed && passes < 4) {
      progressed = false;
      passes++;
      var cand = [];
      for (var i = 0; i < RULES.length; i++) {
        var r = RULES[i];
        if (SKIP[r.id]) continue;
        if ((r.id === 'ox-no2-h2o' || r.id === 'v1-no2-h2o') && v.tags.concHNO3) continue;
        if (!canRun(v, r, conds)) continue;
        cand.push(r);
      }
      if (!cand.length) break;
      // 同一净方程式只执行优先级最高的一条，避免重复扣料
      var byeq = {};
      cand.forEach(function (r) {
        var k = r._key || r.equation || r.id;
        if (!byeq[k] || r.prio > byeq[k].prio) byeq[k] = r;
      });
      cand = Object.keys(byeq).map(function (k) { return byeq[k]; });
      cand.sort(function (a, b) { return (b.prio || 0) - (a.prio || 0); });
      for (var c = 0; c < cand.length; c++) {
        var rule = cand[c];
        var maxExt = Infinity, limited = null;
        var dryRule = (rule.conditions || []).indexOf('无水') >= 0;
        for (var k2 = 0; k2 < rule.need.length; k2++) {
          var need = rule.need[k2];
          var s = sp(need.s);
          if (s.ionic && !hasWater && !dryRule) { maxExt = 0; break; }
          var av = availableFor(v, rule, need.s);
          var ex = av / need.n;
          if (ex < maxExt) { maxExt = ex; limited = need.s; }
        }
        if (!isFinite(maxExt) || maxExt < 1e-6) continue;
        var rate = (v.stir > 0 ? 3.2 : 2.2) * dt;
        var extent = maxExt * Math.min(1, rate);
        if (extent < 1e-7) continue;
        execute(v, rule, extent, events);
        if (events.length) events[events.length - 1].limited = limited;
        progressed = true;
        hasWater = (v.pool.H2O || 0) > 1e-5;
      }
    }
  }

  function dissolve(v, dt) {
    if ((v.pool.H2O || 0) < 1e-5) return false;
    var changed = false;
    for (var i = v.solids.length - 1; i >= 0; i--) {
      var x = v.solids[i];
      if (x.kind !== 'crystal' || !x.comp) continue;
      var capFrac = x.sol === 'soluble' ? 1 : (x.sol === 'slight' ? 0.12 : 0);
      if (capFrac <= 0) continue;
      var maxDissolve = x.units * capFrac;
      var room = maxDissolve - x.dissolved;
      if (room <= 1e-9) continue;
      var rate = (x.sol === 'slight' ? 0.18 : 1.1) * (1 + (v.stir > 0 ? 1.5 : 0)) * dt;
      var d = Math.min(x.mol, room, x.mol * rate + 1e-7);
      if (d <= 0) continue;
      x.mol -= d; x.dissolved += d;
      changed = true;
      x.comp.forEach(function (c) {
        var n = c.n * d;
        if (c.s === 'H2O') { v.pool.H2O = (v.pool.H2O || 0) + n; return; }
        var s = sp(c.s);
        if (s.phase === 'solid') {
          v.solids.push({ kind: 'ppt', sid: c.s, mol: n, initial: n, sol: 'insoluble', color: s.color, name: s.name });
        } else v.pool[c.s] = (v.pool[c.s] || 0) + n;
      });
      if (x.mol < 1e-8) v.solids.splice(i, 1);
    }
    return changed;
  }

  function step(v, dt) {
    dt = dt || 0.2;
    var events = [];
    // 温度
    var target = v.envHeat || 25;
    if (target > v.temp) v.temp += (target - v.temp) * Math.min(1, dt * 1.1);
    else v.temp += (25 - v.temp) * Math.min(1, dt * 0.22);
    if (v.temp < 25) v.temp = 25;
    v.waterbath = v.envName === 'waterbath';
    // 有水时温度被水的沸点锁住，多余热量用于汽化；蒸干后温度才能继续升高
    var waterMol = v.pool.H2O || 0;
    v.boiling = false;
    if (waterMol > 0.02) {
      if (v.temp > 100.4) v.temp = 100.4;
      if (v.temp > 94) {
        v.boiling = true;
        var evap = Math.min(waterMol, dt * (0.018 + Math.max(0, (v.envHeat || 100) - 100) * 0.00045));
        v.pool.H2O -= evap;
        if (v.pool.H2O < EPS) delete v.pool.H2O;
        v.steam = Math.min(1, v.steam + dt * 0.7);
      }
    }
    if (!v.boiling && v.steam > 0) v.steam = Math.max(0, v.steam - dt * 0.2);
    // 搅拌衰减
    if (v.stir > 0) v.stir = Math.max(0, v.stir - dt);
    // 溶解
    dissolve(v, dt);
    // 点燃时从空气补给 O2
    if (v.ignited && v.open && (v.gases.O2 || 0) < 1e-4) v.gases.O2 = (v.gases.O2 || 0) + 0.0035;
    // 反应
    runReactions(v, dt, events);
    // 合并同一规则在本步内的多次结算，并过滤掉痕量事件
    if (events.length) {
      var agg = {};
      events.forEach(function (e) {
        var k = e.rule.id;
        if (!agg[k]) agg[k] = { rule: e.rule, extent: 0 };
        agg[k].extent += e.extent;
      });
      events = Object.keys(agg).map(function (k) { return agg[k]; })
        .filter(function (e) { return e.extent > 1e-5; });
    }
    // 气体逸出
    if (v.open) {
      for (var g in v.gases) {
        if (g === 'O2' && (v.temp > 60 || v.ignited)) continue;
        v.gases[g] *= Math.max(0, 1 - dt * 0.10);
        if (v.gases[g] < 1e-8) delete v.gases[g];
      }
    }
    // 活跃反应记录老化
    for (var id in v.active) {
      if (Date.now() - v.active[id].t > 900) delete v.active[id];
    }
    // 温度回落
    if (v.temp > 700) v.temp = 700;
    return {
      events: events, changed: events.length > 0,
      temp: v.temp, boiling: v.boiling, layers: layers(v),
      color: solutionColor(v)
    };
  }

  /* ---------------- 查询 ---------------- */
  function contents(v) {
    var out = [];
    var seen = {};
    for (var sid in v.pool) {
      var s = sp(sid);
      if (sid === 'H2O' && v.pool[sid] > 0.05) {
        out.push({ sid: sid, name: '水', formula: 'H₂O', mol: v.pool[sid], state: 'liquid', color: null, role: 'water' });
        continue;
      }
      out.push({ sid: sid, name: s.name, formula: s.formula, mol: v.pool[sid], state: s.ionic ? 'ion' : 'dissolved', color: s.color, role: s.ionic ? 'ion' : 'solute' });
    }
    v.solids.forEach(function (x) {
      if (x.mol < 1e-8) return;
      var s = x.sid ? sp(x.sid) : null;
      var name = s ? s.name : x.name;
      var formula = x.sid ? s.formula : (x.formula || '').replace(/([0-9]+)/g, function (d) { return '₀₁₂₃₄₅₆₇₈₉'[+d]; });
      var key = (x.sid || x.name) + x.kind;
      if (seen[key]) { seen[key].mol += x.mol; return; }
      seen[key] = { sid: x.sid || x.reagentId, name: name, formula: formula, mol: x.mol,
        state: x.kind === 'ppt' ? 'precipitate' : (x.kind === 'solid' ? 'solid' : 'undissolved'),
        color: x.color, role: x.kind };
      out.push(seen[key]);
    });
    for (var g in v.gases) {
      if (v.gases[g] < 1e-6) continue;
      var sg = sp(g);
      out.push({ sid: g, name: sg.name, formula: sg.formula, mol: v.gases[g], state: 'gas', color: sg.color, role: 'gas' });
    }
    out.sort(function (a, b) {
      var rank = { precipitate: 5, solid: 4, undissolved: 4, gas: 3, ion: 2, solute: 2, water: 0, dissolved: 2 };
      return (rank[b.state] || 0) - (rank[a.state] || 0) || b.mol - a.mol;
    });
    return out;
  }

  function missingConditions(v) {
    var conds = condSet(v);
    var out = [];
    for (var i = 0; i < RULES.length; i++) {
      var r = RULES[i], ok = true;
      if (r.need.length < 2) continue;
      for (var j = 0; j < r.need.length; j++) if (available(v, r.need[j].s) < Math.max(5e-4, r.need[j].n * 2e-4)) { ok = false; break; }
      if (!ok) continue;
      var miss = (r.conditions || []).filter(function (c) { return !conds[c]; });
      if (miss.length) out.push({ rule: r, missing: miss });
    }
    out.sort(function (a, b) { return a.missing.length - b.missing.length; });
    return out.slice(0, 4);
  }

  function activeReactions(v) {
    return Object.keys(v.active).map(function (k) { return v.active[k].rule; });
  }

  function pairRules(aid, bid) {
    var a = BYID[aid], b = BYID[bid];
    if (!a || !b) return [];
    var pool = {}, setA = {}, setB = {};
    function add(r, set) {
      (r.composition || []).forEach(function (c) { pool[c.s] = (pool[c.s] || 0) + c.n; set[c.s] = 1; });
      if (r.state === 'aqueous' || r.state === 'liquid') { pool.H2O = (pool.H2O || 0) + 1; set.H2O = 1; }
    }
    add(a, setA); add(b, setB);
    // 只看“两种物质是否能共同提供反应所需的物种”，且双方都要参与
    var seen = {};
    return RULES.filter(function (r) {
      if (SKIP[r.id]) return false;
      if (!r.need.every(function (it) { return (pool[it.s] || 0) > 0; })) return false;
      var fromA = r.need.some(function (it) { return setA[it.s]; });
      var fromB = r.need.some(function (it) { return setB[it.s]; });
      if (!(fromA && fromB)) return false;
      if (seen[r._key]) return false;
      seen[r._key] = 1;
      return true;
    }).map(function (r) {
      return { id: r.id, name: r.name, equation: r.equation, type: r.type, conditions: r.conditions,
        phenomena: r.phenomena, prio: r.prio };
    }).sort(function (x, y) { return y.prio - x.prio; }).slice(0, 24);
  }

  function describe(v) {
    var vol = volumes(v);
    return {

  }

  function hint(v) {
    var miss = missingConditions(v);
    if (!miss.length) return '';
    var names = miss[0].missing.slice(0, 2).join('、');
    return '还差条件：' + names;
  }

  var api = {
    init: init, createVessel: createVessel, clean: clean, addReagent: addReagent,

    reagents: function () { return REAGENTS; }, rules: function () { return RULES; },
    species: function () { return SPECIES; }, CAP: CAP, amountOf: amountOf
  };

});
