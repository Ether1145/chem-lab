    el.style.cssText = 'left:' + it.x + 'px;top:' + it.y + 'px;width:' + it.w + 'px;height:' + it.h + 'px';
    var tag = it.id + it.type;
    el.innerHTML = '<div class="glass">' + (it.kind === 'vessel' ? svgFor(it.type, tag) : sourceSVG(it.type, tag)) + '</div>' +
      '<div class="heatwave"></div>' +
      '<div class="flame-wrap"><i class="flame"></i></div>' +
      '<span class="vlabel"></span><span class="vcont"></span>' +
      '<button class="rm" type="button" title="移除">×</button>';
    it.el = el;
    it.flame = el.querySelector('.flame');
    it.flameWrap = el.querySelector('.flame-wrap');
    it.label = el.querySelector('.vlabel');
    it.cont = el.querySelector('.vcont');
    if (it.kind === 'vessel') {
      it.liqAq = el.querySelector('.liq-aq');
      it.liqOrg = el.querySelector('.liq-org');
      it.liqTop = el.querySelector('.liq-top');
      it.ppt = el.querySelector('.ppt-layer');
      it.gas = el.querySelector('.gas-fill');
      it.crystals = el.querySelector('.crystals');
      it.crystalEls = [];
      for (var i = 0; i < 7; i++) {
        var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('class', 'crystal');
        c.setAttribute('r', '0');
        c.setAttribute('fill', 'transparent');
        it.crystals.appendChild(c);
        it.crystalEls.push(c);
      }
      it.chipEls = [];
      for (var k = 0; k < 3; k++) {
        var rct = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rct.setAttribute('class', 'crystal chip');
        rct.setAttribute('width', '0');
        rct.setAttribute('height', '0');
        rct.setAttribute('rx', '1.2');
        rct.setAttribute('fill', 'transparent');
        it.crystals.appendChild(rct);
        it.chipEls.push(rct);
      }
    }
    layer.appendChild(el);
    document.getElementById('bench-empty').hidden = state.items.length > 0;
  }

  function removeItem(it) {
    var i = state.items.indexOf(it);
    if (i < 0) return;
    Array.prototype.forEach.call(bench.querySelectorAll('.fxnote'), function (n) {
      if (n.getAttribute('data-vid') === it.id) n.remove();
    });
    state.items.splice(i, 1);
    if (it.el) it.el.remove();
    if (state.sel === it.id) state.sel = null;
    if (state.bottle && state.items.length === 0) { /* keep */ }
    document.getElementById('bench-empty').hidden = state.items.length > 0;
    refreshUI();
  }

  function clearBench() {
    state.items.slice().forEach(removeItem);
    state.logs = []; state.logIndex = {}; state.bottle = null; updateCarry();
    particles.length = 0;
    Array.prototype.forEach.call(bench.querySelectorAll('.fxnote'), function (n) { n.remove(); });
    renderLog(); refreshUI();
    toast('实验台已清空');
  }

  /* ---------------- 取用与倾倒 ---------------- */
  function updateCarry() {
    var bar = document.getElementById('carry');
    if (!bar) return;
    if (!state.bottle) { bar.hidden = true; return; }
    var r = BYID[state.bottle];
    var d = currentDoseInfo();
    bar.hidden = false;
    document.getElementById('carry-name').textContent = r.name;
    document.getElementById('carry-dose').textContent = '· ' + d.labels[state.dose];
    document.getElementById('carry-dot').style.background = r.color || (r.state === 'gas' ? 'rgba(190,220,245,.7)' : '#dfe9f2');
  }

  function pickBottle(rid) {
    var r = BYID[rid];
    state.bottle = rid;
    state.bottleAt = Date.now();
    renderBottles(); renderDoses(); updateCarry();
    var d = currentDoseInfo();
    toast('拿起 ' + r.name + ' · 当前取量 ' + d.labels[state.dose] + (r.state === 'solid' ? '，点仪器加入' : '，点仪器倒入'));
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (window.innerWidth <= 900) {
      setTimeout(function () { bench.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);
    }
  }

  function dropBottle() {
    state.bottle = null;
    renderBottles(); renderDoses(); updateCarry();
  }

  function pourInto(it, rid) {
    var r = BYID[rid];
    if (!r) return null;
    state.pouredAt = Date.now();
    if (!isVessel(it)) { toast('先选中一台仪器'); return null; }
    var dose = doseFor(r);
    var res = E.addReagent(it, rid, dose);
    if (r.state === 'gas' && it.type !== 'gasjar') {
      toast('气体在敞口容器中会逸出，建议用集气瓶');
    }
    if (res.ok) {
      spawnPour(it, r);
      state.sel = it.id;
      refreshUI();
    }
    toast(res.msg || res.why || '');
    updateCarry();
    return res;
  }

  /* ---------------- 反应事件 ---------------- */
  function firstPhenomenon(r) { return String(r.phenomena || '').split('；')[0] || ''; }
  function ruleHasGas(r) { for (var i = 0; i < r.give.length; i++) if (E.sp(r.give[i].s).phase === 'gas') return true; return false; }
  function guessPrecipColor(text) {
    if (/砖红/.test(text)) return '#b5451f';
    if (/红褐/.test(text)) return '#8d3a1c';
    if (/黑色/.test(text)) return '#1b1f24';
    if (/蓝色/.test(text)) return '#2f7fc4';
    if (/黄色/.test(text)) return '#e0c341';
    if (/绿色/.test(text)) return '#3fa35a';
    if (/白色/.test(text)) return '#eef2f7';
    return '#c9d4df';
  }

  function onEvents(it, events) {
    var now = Date.now();
    events.forEach(function (ev) {
      var r = ev.rule;
      if (r.fx && r.fx.flame) it.ui.flameColor = r.fx.flame;
      if (r.fx && r.fx.silver) it.ui.silver = true;
      if (it.ui.silver) it.el.classList.add('silver');
      var last = it.ui.fx[r.id] || 0;
      if (now - last > 450) {
        it.ui.fx[r.id] = now;
        triggerFX(it, r, ev);
      }
      addLog(it, r, ev);
    });
    renderInfoSoon();
  }

  function floatNote(it, text, fx) {
    if (!text) return;
    if (text.length > 16) text = text.slice(0, 15) + '…';
    var idx = state.items.indexOf(it);
    var off = (idx >= 0 ? idx % 3 : 0) * 20;
    Array.prototype.forEach.call(bench.querySelectorAll('.fxnote'), function (n) {
      if (n.getAttribute('data-vid') === it.id) n.remove();
    });
    var note = document.createElement('span');
    note.className = 'fxnote';
    note.setAttribute('data-vid', it.id);
    note.textContent = text;
    note.style.left = Math.round(it.x + it.w / 2) + 'px';
    note.style.top = Math.round(it.y - 6 - off) + 'px';
    var c = (fx && (fx.tint || fx.precip || fx.flame)) || '#3fd6a4';
    note.style.borderColor = c;
    bench.appendChild(note);
    setTimeout(function () { note.classList.add('out'); }, 2200);
    setTimeout(function () { if (note.parentNode) note.parentNode.removeChild(note); }, 2900);
  }

  function triggerFX(it, r, ev) {
    var phe = r.phenomena || '';
    var fx = r.fx || {};
    var gas = ruleHasGas(r) || fx.bubbles;
    if (gas || /气泡|气体/.test(phe)) spawnBubbles(it, 16);
    if (fx.precip || /↓|沉淀/.test(r.equation + phe)) spawnPrecip(it, fx.precip || guessPrecipColor(phe), 20);
    if (fx.flame || /火焰|燃烧|火星/.test(phe)) spawnFlame(it, fx.flame || it.ui.flameColor || '#ffc447', 16);
    if (fx.smoke || /白雾|白烟|烟/.test(phe)) spawnSmoke(it, 10);
    if (/爆炸|爆鸣/.test(phe)) spawnFlash(it);
    floatNote(it, firstPhenomenon(r), fx);
  }

  function addLog(it, r, ev) {
    var now = Date.now();
    var key = it.id + '|' + r.id;
    var ent = state.logIndex[key];
    if (ent && now - ent.last < 4200) {
      ent.extent += ev.extent;
      ent.last = now;
      ent.limited = ev.limited || ent.limited;
    } else {
      ent = {
        key: key, vid: it.id, rule: r, extent: ev.extent, limited: ev.limited,
        where: labelOf(it.type), time: new Date().toTimeString().slice(0, 5),
        last: now
      };
      state.logs.unshift(ent);
      state.logIndex[key] = ent;
      if (state.logs.length > 36) state.logs.length = 36;
    }
    renderLogSoon();
  }

  function renderLogSoon() {
    if (renderLogSoon._t) return;
    renderLogSoon._t = setTimeout(function () { renderLogSoon._t = 0; renderLog(); }, 180);
  }

  function eqHTML(eq) {
    return esc(eq || '').replace(/(→|⇌)/g, '<span class="arrow">$1</span>');
  }

  function renderLog() {
    var box = document.getElementById('log');
    document.getElementById('log-count').textContent = state.logs.length ? state.logs.length + ' 条' : '';
    if (!state.logs.length) {
      box.innerHTML = '<div class="log-empty">还没有反应。试试：稀盐酸 + 碳酸钙，或者硫酸铜溶液 + 氢氧化钠。</div>';
      return;
    }
    box.innerHTML = state.logs.map(function (e) {
      var r = e.rule;
      var phe = String(r.phenomena || '').split('；').filter(Boolean);
      var conds = (r.conditions || []).map(function (c) {
        return '<span class="tag cond">' + esc(c) + '</span>';
      }).join('');
      var lim = e.limited ? E.sp(e.limited).formula : '';
      return '<div class="entry">' +
        '<div class="eh"><h3>' + esc(r.name) + '</h3>' +
        '<span class="tag type">' + esc(r.type) + '</span>' + conds +
        '<span class="where">' + esc(e.where) + ' · ' + esc(e.time) + '</span></div>' +
        (r.equation ? '<div class="eq">' + eqHTML(r.equation) + '</div>' : '') +
        '<ul class="phe">' + phe.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' +
        '<p class="amt">已反应 ' + E.fmtMol(e.extent) + (lim ? ' · 限量试剂 ' + lim : '') + '</p>' +
        (r.edu ? '<p class="edu">' + esc(r.edu) + '</p>' : '') +
        '</div>';
    }).join('');
  }

  /* ---------------- 信息面板 ---------------- */
  function conditionChips(it) {
    var c = E.condSet(it);
    var keys = DISPLAY_CONDS.filter(function (k) { return c[k]; });
    if (!keys.length) return '';
    return keys.map(function (k) { return '<span class="tag cond">' + esc(k === '无水' ? '干燥' : k) + '</span>'; }).join('');
  }

  function hintText(it) {
    if (E.activeReactions(it).length || it.temp > 150 || it.ignited) return '';
    var miss = E.missingConditions(it);
    if (!miss.length) return '';
    var names = miss[0].missing.filter(function (x) { return x !== '无水'; }).slice(0, 2);
    if (!names.length) return '';
    return '还差：' + names.map(function (x) { return COND_TIP[x] || x; }).join('；');
  }

  function makeInfoHTML(it) {
    if (!isVessel(it)) {
      return '<div class="info-empty">' + esc(SOURCES[it.type].name) + '：' + esc(SOURCES[it.type].desc) +
        (SOURCES[it.type].target ? '（目标 ' + SOURCES[it.type].target + ' ℃）' : '') +
        '<br>当前：' + (it.on ? '已开启' : '已关闭') + '；点它开启/关闭，拖到仪器旁边生效。</div>';
    }
    var d = E.describe(it);
    var volText = d.volume >= 1 ? d.volume.toFixed(0) + ' mL' : d.volume.toFixed(1) + ' mL';
    var status = d.ignited ? '燃烧中' : (d.boiling ? '沸腾' : (it.envHeat ? '加热中' : '常温'));
    var phText = d.volume > 0.3 ? d.ph.toFixed(1) : '—';
    var html = '<div class="metrics">' +
      '<div class="metric"><b>' + Math.round(d.temp) + ' ℃</b><span>温度</span></div>' +
      '<div class="metric"><b>' + volText + '</b><span>体积 / ' + d.capacity + ' mL</span></div>' +
      '<div class="metric' + (d.volume > 0.3 && (d.ph < 4 || d.ph > 10) ? ' warn' : '') + '"><b>' + phText + '</b><span>pH</span></div>' +
      '<div class="metric' + (d.ignited ? ' warn' : '') + '"><b>' + status + '</b><span>状态</span></div>' +
      '</div>';
    var conds = conditionChips(it);
    if (conds) html += '<div class="chips" style="margin-bottom:9px">' + conds + '</div>';
    if (!d.contents.length) {
      html += '<div class="info-empty">仪器是空的。从左边拿试剂倒进来。</div>';
    } else {
      html += '<div class="contents">' + d.contents.map(function (c) {
        var st = { 'ion': '离子', 'precipitate': '沉淀', 'solid': '固体', 'undissolved': '未溶', 'gas': '气体', 'water': '水', 'solute': '溶质', 'dissolved': '溶解' }[c.state] || '';
        var cls = c.state === 'ion' ? 'ion' : (c.state === 'precipitate' ? 'precipitate' : (c.state === 'gas' ? 'gas' : ''));
        return '<div class="citem"><span class="dot" style="background:' + (c.color || '#8fa9c0') + '"></span>' +
          '<span class="nm">' + esc(c.name) + '</span><span class="fm">' + esc(c.formula || '') + '</span>' +
          (st ? '<span class="state-tag ' + cls + '">' + st + '</span>' : '') +
          '<span class="mol">' + E.fmtMol(c.mol) + '</span></div>';
      }).join('') + '</div>';
    }
    var act = E.activeReactions(it);
    if (act.length) {
      html += '<div class="chips" style="margin-top:9px">' + act.map(function (r) {
        return '<span class="tag type">正在反应 · ' + esc(r.name) + '</span>';
      }).join('') + '</div>';
    }
    var hint = hintText(it);
    if (hint) html += '<div class="mini-hint">' + esc(hint) + '</div>';
    return html;
  }

  function renderInfoSoon() {
    if (renderInfoSoon._t) return;
    renderInfoSoon._t = setTimeout(function () { renderInfoSoon._t = 0; renderInfo(); }, 120);
  }

  function renderInfo() {
    var it = state.sel ? itemById(state.sel) : null;
    var title = document.getElementById('info-title');
    var sub = document.getElementById('info-sub');
    var box = document.getElementById('info');
    if (!it) {
      title.textContent = '仪器信息';
      sub.textContent = '';
      box.innerHTML = '<div class="info-empty">点选一台仪器，查看它的温度、体积、pH 和内容物。<br><br>取试剂：点试剂瓶拿起，再点仪器；也可以直接把瓶子拖到仪器上。固体要加水才会溶解成离子。</div>';
      return;
    }
    title.textContent = labelOf(it.type);
    sub.textContent = isVessel(it) ? (it.ui.desc ? Math.round(it.ui.desc.temp) + ' ℃' : '') : '条件仪器';
    box.innerHTML = makeInfoHTML(it);
  }

  function labelOf(type) {
    return GEO[type] ? ({ testtube: '试管', beaker: '烧杯', flask: '锥形瓶', gasjar: '集气瓶', dish: '蒸发皿' })[type] : (SOURCES[type] ? SOURCES[type].name : type);
  }

  /* ---------------- 工具栏按钮 ---------------- */
  function refreshUI() {
    var it = state.sel ? itemById(state.sel) : null;
    var v = isVessel(it);
    document.getElementById('btn-ignite').disabled = !v;
    document.getElementById('btn-stir').disabled = !v;
    document.getElementById('btn-empty').disabled = !it;
    document.getElementById('btn-clean').disabled = !v;
    document.getElementById('btn-remove').disabled = !it;
    var ig = document.getElementById('btn-ignite');
    if (v) ig.classList.toggle('on', !!it.ignited);
    else ig.classList.remove('on');
    var hint = document.getElementById('sel-hint');
    var empty = document.getElementById('bench-empty');
    empty.hidden = state.items.length > 0;
    if (!it) {
      hint.className = 'sel-hint';
      hint.textContent = '未选中仪器 · 把仪器拖到台面上开始';
      document.getElementById('bench-hint').textContent = '把仪器拖进来，再把试剂拖到仪器上';
    } else {
      hint.className = 'sel-hint';
      if (isVessel(it)) {
        var d = it.ui.desc || E.describe(it);
        hint.innerHTML = '已选中 <b>' + esc(labelOf(it.type)) + '</b> · ' + Math.round(d.temp) + ' ℃ · ' +
          (d.volume >= 1 ? d.volume.toFixed(0) : d.volume.toFixed(1)) + ' mL' +
          (it.ui.desc && it.ui.desc.contents.length ? ' · ' + esc(it.ui.desc.contents.slice(0, 3).map(function (c) { return c.formula || c.name; }).join(' + ')) : '');
        document.getElementById('bench-hint').textContent = '点试剂瓶拿起，再点仪器倒入';
      } else {
        hint.innerHTML = '已选中 <b>' + esc(SOURCES[it.type].name) + '</b> · 点一下开启/关闭，拖到仪器旁边生效';
        document.getElementById('bench-hint').textContent = SOURCES[it.type].desc;
      }
    }
    renderInfo();
  }

  /* ---------------- 粒子 ---------------- */
  var particles = [];
  function push(p) { if (particles.length > 520) particles.shift(); particles.push(p); }

  function spawnBubbles(it, n) {
    if (!isVessel(it)) return;
    var g = geom(it);
    if (g.level < 0.02) return;
    var surf = g.bottom - g.h * g.level;
    for (var i = 0; i < n; i++) {
      push({ k: 'b', x: g.x + 4 + Math.random() * Math.max(2, g.w - 8), y: g.bottom - 3 - Math.random() * 10,
        vy: -(14 + Math.random() * 24), r: 1.3 + Math.random() * 2.2, life: 1.1 + Math.random() * 1.1,
        age: 0, top: surf, ph: Math.random() * 6.28 });
    }
  }
  function spawnPrecip(it, color, n) {
    if (!isVessel(it)) return;
    var g = geom(it);
    if (g.level < 0.02) return;
    var surf = g.bottom - g.h * g.level;
    for (var i = 0; i < n; i++) {
      push({ k: 'p', x: g.x + 3 + Math.random() * Math.max(2, g.w - 6), y: surf + Math.random() * Math.max(4, g.bottom - surf),
        vy: 12 + Math.random() * 20, r: 1.2 + Math.random() * 2.2, life: 6, age: 0,
        color: color, floor: g.bottom - 2, drift: (Math.random() - 0.5) * 8 });
    }
  }
  function spawnFlame(it, color, n) {
    if (!isVessel(it)) return;
    var g = geom(it);
    var fy = (it.type === 'beaker' || it.type === 'dish') ? Math.max(g.mouth, surfaceY(it)) : g.mouth;
    var cx = it.x + it.w / 2;
    for (var i = 0; i < n; i++) {
      push({ k: 'f', x: cx + (Math.random() - 0.5) * it.w * 0.3, y: fy - Math.random() * 4,
        vx: (Math.random() - 0.5) * 20, vy: -(30 + Math.random() * 55), r: 2 + Math.random() * 3.6,
        life: 0.5 + Math.random() * 0.45, age: 0, color: color || it.ui.flameColor || '#ffc447' });
    }
  }
  function spawnSmoke(it, n) {
    if (!isVessel(it)) return;
    var g = geom(it), cx = it.x + it.w / 2;
    for (var i = 0; i < n; i++) {
      push({ k: 's', x: cx + (Math.random() - 0.5) * it.w * 0.55, y: g.mouth + Math.random() * 8,
        vx: (Math.random() - 0.5) * 12, vy: -(12 + Math.random() * 18), r: 4 + Math.random() * 7,
        life: 1.8 + Math.random() * 1.4, age: 0 });
    }
  }
  function spawnSteam(it, n) {
    var g = geom(it), cx = it.x + it.w / 2, y = it.y + G_MOUTH(it) - 2;
    for (var i = 0; i < n; i++) {
      push({ k: 's', x: cx + (Math.random() - 0.5) * it.w * 0.7, y: y,
        vx: (Math.random() - 0.5) * 10, vy: -(14 + Math.random() * 16), r: 3 + Math.random() * 5,
        life: 1.4 + Math.random() * 1.2, age: 0 });
    }
  }
  function G_MOUTH(it) { var G = GEO[it.type]; return G.mouth * (it.h / G.vbH); }
  function spawnFlash(it) {
    var g = geom(it);
    push({ k: 'fl', x: it.x + it.w / 2, y: it.y + it.h * 0.5, r: 10, life: 0.5, age: 0, max: Math.max(it.w, it.h) * 1.15 });
  }
  function spawnPour(it, reagent) {
    var g = geom(it);
    var color = reagent.color || (reagent.state === 'gas' ? 'rgba(200,225,245,.55)' : '#cfe6f7');
    var solid = reagent.state === 'solid';
    var startY = it.y - 26;
    for (var i = 0; i < 13; i++) {
      push({ k: solid ? 'c' : 'd', x: it.x + it.w / 2 + (Math.random() - 0.5) * (solid ? it.w * 0.3 : 8),
        y: startY - i * 3, vy: 60 + Math.random() * 20, r: solid ? 1.6 + Math.random() * 1.6 : 2 + Math.random() * 2,
        life: 0.9, age: 0, color: color, target: Math.min(surfaceY(it), g.bottom) });
    }
  }

  function stepParticles(dt) {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    var alive = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.age += dt;
      if (p.age > p.life) continue;
      var t = p.age / p.life;
      if (p.k === 'b') {
        p.y += p.vy * dt; p.x += Math.sin((p.age * 9 + p.ph)) * 6 * dt;
        if (p.y < p.top) { continue; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fillStyle = 'rgba(215,242,255,' + (0.20 + 0.28 * (1 - t)) + ')';
        ctx.fill();
        ctx.strokeStyle = 'rgba(205,240,255,' + (0.55 * (1 - t)) + ')';
        ctx.lineWidth = 1; ctx.stroke();
      } else if (p.k === 'p') {
        if (p.y < p.floor) { p.y += p.vy * dt; p.x += p.drift * dt; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fillStyle = hexA(p.color, 0.85 * (1 - t * 0.55)); ctx.fill();
      } else if (p.k === 'f') {
        p.y += p.vy * dt; p.x += p.vx * dt; p.vy *= 0.985;
        var c = hex2rgb(p.color);
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4);
        g.addColorStop(0, 'rgba(255,255,235,' + (0.7 * (1 - t)) + ')');
        g.addColorStop(0.45, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (0.55 * (1 - t)) + ')');
        g.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.4, 0, 6.2832); ctx.fill();
      } else if (p.k === 's') {
        p.y += p.vy * dt; p.x += p.vx * dt; p.r += dt * 4;
        var sg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.2);
        sg.addColorStop(0, 'rgba(214,232,246,' + (0.22 * (1 - t)) + ')');
        sg.addColorStop(1, 'rgba(214,232,246,0)');
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2, 0, 6.2832); ctx.fill();
      } else if (p.k === 'd' || p.k === 'c') {
        p.y += p.vy * dt; p.vy += 380 * dt;
        if (p.y > p.target) { continue; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fillStyle = p.k === 'c' ? hexA(p.color, 0.95) : hexA(p.color, 0.6); ctx.fill();
      } else if (p.k === 'fl') {
        var rad = 10 + (p.max - 10) * t;
        var gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
        gr.addColorStop(0, 'rgba(255,255,240,' + (0.8 * (1 - t)) + ')');
        gr.addColorStop(0.4, 'rgba(255,205,120,' + (0.45 * (1 - t)) + ')');
        gr.addColorStop(1, 'rgba(255,150,60,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 6.2832); ctx.fill();
      }
      alive.push(p);
    }
    particles = alive;
  }
  function hex2rgb(h) {
    h = String(h || '').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return isNaN(n) ? [220, 235, 245] : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function hexA(h, a) { var c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  function resizeCanvas() {
    var r = bench.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    canvas.style.width = r.width + 'px'; canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ---------------- 环境（热源/光源） ---------------- */
  function updateEnv() {
    var srcs = state.items.filter(function (i) { return i.kind === 'source' && i.on; });
    state.items.forEach(function (it) {
      if (it.kind !== 'vessel') return;
      var best = 0, name = '', light = false;
      srcs.forEach(function (s) {
        var dx = Math.abs((s.x + s.w / 2) - (it.x + it.w / 2));
        var near = dx < (s.w + it.w) / 2 + 14;
        if (!near) return;
        if (s.type === 'uvlamp') { light = true; return; }
        if (s.y + s.h < it.y + it.h * 0.4) return;
        if (s.type === 'lamp' && 450 > best) { best = 450; name = 'lamp'; }
        if (s.type === 'waterbath' && 100 > best) { best = 100; name = 'waterbath'; }
        if (s.type === 'furnace' && 700 > best) { best = 700; name = 'furnace'; }
      });
      it.envHeat = best; it.envName = name; it.light = light;
    });
  }

  /* ---------------- 绘制 ---------------- */
  function setRect(el, x, y, w, h, fill, opacity) {
    if (!el) return;
    el.setAttribute('x', x.toFixed(1));
    el.setAttribute('y', y.toFixed(1));
    el.setAttribute('width', Math.max(0, w).toFixed(1));
    el.setAttribute('height', Math.max(0, h).toFixed(1));
    el.setAttribute('fill', fill || 'transparent');
    el.setAttribute('opacity', opacity == null ? 1 : opacity);
  }

  function paintItem(it, dt) {
    if (it.kind === 'source') {
      var under = state.items.some(function (v) {
        return v.kind === 'vessel' && Math.abs((v.x + v.w / 2) - (it.x + it.w / 2)) < (v.w + it.w) / 2 && v.y < it.y;
      });
      it.el.classList.toggle('under', under);
      it.el.classList.toggle('source-behind', under && it.type !== 'lamp');
      it.el.classList.toggle('on', !!it.on);
      it.el.classList.toggle('lit', !!it.on && it.type === 'lamp');
      if (it.type === 'uvlamp') {
        var uv = it.el.querySelector('.uv-glow');
        if (uv) uv.setAttribute('opacity', it.on ? '0.95' : '0.3');
      }
      if (it.flameWrap) {
        it.flameWrap.style.top = (it.type === 'lamp' ? 28 : 10) + 'px';
        if (it.flame) it.flame.style.setProperty('--flame', '#ffb347');
      }
      if (it.label) it.label.textContent = nameOf(it.type) + ' · ' + (it.on ? '开' : '关');
      return;
    }
    var d = it.ui.desc || E.describe(it);
    it.ui.desc = d;
    var G = GEO[it.type];
    var sx = it.w / G.vbW, sy = it.h / G.vbH;
    var b = G.body;
    // 重要：SVG 内部属性使用 viewBox 用户单位，不要再乘 CSS 缩放
    var bx = b.x, bw = b.w, bh = b.h, bottom = b.bottom;
    var inset = G.solidInset || 0;
    var vol = d.volume || 0;
    var level = Math.min(1, Math.pow(vol / G.cap, 0.72));
    var lh = bh * level;
    var layers = d.layers || [];
    var total = layers.reduce(function (s, l) { return s + l.ml; }, 0) || 1;
    var cursor = bottom;
    var aqEl = it.liqAq, orgEl = it.liqOrg;
    setRect(aqEl, bx, bottom, bw, 0, 'transparent', 0);
    setRect(orgEl, bx, bottom, bw, 0, 'transparent', 0);
    layers.forEach(function (l) {
      var hh = (l.ml / total) * lh;
      var y = cursor - hh;
      if (l.phase === 'aq') setRect(aqEl, bx, y, bw, hh, hexA(l.color, 0.74), 1);
      else setRect(orgEl, bx, y, bw, hh, hexA(l.color, 0.66), 1);
      cursor = y;
    });
    if (it.liqTop) {
      if (lh > 1) setRect(it.liqTop, bx, bottom - lh, bw, 1.2, 'rgba(235,248,255,.28)', 1);
      else setRect(it.liqTop, bx, bottom, bw, 0, 'transparent', 0);
    }
    // 气体
    var gasMol = 0, gasColor = null;
    d.contents.forEach(function (c) {
      if (c.state === 'gas') { gasMol += c.mol; if (c.color && !gasColor) gasColor = c.color; }
    });
    if (gasMol > 1e-6) {
      var gop = gasColor ? Math.min(0.40, 0.14 + gasMol * 10) : Math.min(0.26, 0.08 + gasMol * 8);
      it.gas.setAttribute('fill', gasColor || '#bedcf5');
      it.gas.setAttribute('opacity', String(gop));
    } else it.gas.setAttribute('opacity', 0);
    // 沉淀
    var ppt = d.contents.filter(function (c) { return c.state === 'precipitate'; });
    if (ppt.length) {
      var pm = ppt.reduce(function (s, c) { return s + c.mol; }, 0);
      var pc = ppt[0].color || '#dbe6f0';
      var ph = Math.min(bh * 0.22, 1.6 + pm * 140);
      setRect(it.ppt, bx, bottom - inset - ph, bw, ph + inset, hexA(pc, 0.9), 1);
    } else setRect(it.ppt, bx, bottom, bw, 0, 'transparent', 0);
    // 未溶固体
    var METAL = { Fe: 1, Cu: 1, Zn: 1, Mg: 1, Al: 1, Na: 1, K: 1, Ca: 1, Ag: 1, Pb: 1 };
    var solids = d.contents.filter(function (c) {
      return c.state === 'solid' || c.state === 'undissolved';
    });
    var metals = solids.filter(function (c) { return METAL[c.sid]; });
    var powders = solids.filter(function (c) { return !METAL[c.sid]; });
    // 粉末（盐、碳酸钙、硫、淀粉等）在底部铺一层
    if (powders.length && !ppt.length) {
      var sm = powders.reduce(function (a, c) { return a + c.mol; }, 0);
      var sc = powders[0].color || '#e8eef5';
      var sh = Math.min(bh * 0.13, 1.2 + Math.sqrt(sm * 1000) * 1.15);
      setRect(it.ppt, bx + bw * 0.05, bottom - inset - sh, bw * 0.9, sh + inset, hexA(sc, 0.9), 1);
    }
    // 粉末画成不规则小颗粒
    var draws = [];
    powders.forEach(function (s) {
      var n = Math.max(3, Math.min(4, Math.ceil(Math.sqrt(Math.max(0, s.mol) * 1000) * 0.7)));
      for (var j = 0; j < n; j++) draws.push({ s: s, j: j, n: n });
    });
    if (draws.length > it.crystalEls.length) draws = draws.slice(0, it.crystalEls.length);
    for (var i = 0; i < it.crystalEls.length; i++) {
      var c = it.crystalEls[i];
      if (i < draws.length) {
        var dd = draws[i], sm2 = dd.s;
        var frac = (dd.j + 0.5) / dd.n;
        var jitter = Math.sin((dd.j + 1) * 12.9898 + i) * 0.02;
        var per = Math.max(1e-5, sm2.mol / dd.n);
        var r = Math.min(3.2, Math.max(1.6, 1.0 + Math.sqrt(per * 1000) * 1.1));
        c.setAttribute('cx', (bx + bw * (0.10 + 0.80 * frac + jitter * 2.5)).toFixed(1));
        c.setAttribute('cy', (bottom - inset - r * 0.7 - (i % 2) * 0.5).toFixed(1));
        c.setAttribute('r', r.toFixed(2));
        c.setAttribute('fill', sm2.color || '#dfe8f2');
        c.setAttribute('stroke', 'rgba(6,15,26,.35)');
        c.setAttribute('stroke-width', '0.4');
        c.setAttribute('opacity', '0.96');
      } else {
        c.setAttribute('r', '0'); c.setAttribute('opacity', '0');
      }
    }
    // 金属片画成小条，而不是圆颗粒
    var chips = [];
    metals.forEach(function (s) {
      var n = Math.max(1, Math.min(3, Math.ceil(Math.sqrt(Math.max(0, s.mol) * 1000) / 2)));
      for (var j = 0; j < n; j++) chips.push({ s: s, j: j, n: n });
    });
    for (var q = 0; q < it.chipEls.length; q++) {
      var ch = it.chipEls[q];
      if (q < chips.length) {
        var cc = chips[q], ms = cc.s;
        var cw = Math.min(bw * 0.34, Math.max(9, 9 + Math.sqrt(Math.max(0.001, ms.mol) * 1000) * 1.7));
        var cx = bx + bw * (0.14 + 0.68 * (cc.j + 0.5) / cc.n);
        ch.setAttribute('x', (cx - cw / 2).toFixed(1));
        ch.setAttribute('y', (bottom - inset - 4.8 - (q % 2) * 1.2).toFixed(1));
        ch.setAttribute('width', cw.toFixed(1));
        ch.setAttribute('height', '3.8');
        ch.setAttribute('fill', ms.color || '#c9ced4');
        ch.setAttribute('stroke', 'rgba(6,15,26,.4)');
        ch.setAttribute('stroke-width', '0.4');
      } else {
        ch.setAttribute('width', '0'); ch.setAttribute('height', '0');
      }
    }
    // 火焰
    it.el.classList.toggle('lit', !!it.ignited);
    if (it.ignited) {
      var fy = G.mouth * sy;
      if (it.type === 'dish') fy = Math.max(fy, surfaceY(it) - it.y);
      it.flameWrap.style.top = fy + 'px';
      var col = it.ui.flameColor || '#ffc447';
      it.flame.style.setProperty('--flame', col);
      var size = it.type === 'testtube' ? 0.8 : (it.type === 'gasjar' ? 0.68 : 1);
      it.flame.style.width = (26 * size).toFixed(1) + 'px';
      it.flame.style.height = (42 * size).toFixed(1) + 'px';
    }
    // 状态
    it.el.classList.toggle('heat', (it.envHeat > 0 && it.temp > 35) || d.temp > 70);
    it.el.classList.toggle('silver', !!it.ui.silver);
    it.el.classList.toggle('sel', state.sel === it.id);
    if (it.label) it.label.textContent = labelOf(it.type) + ' · ' + Math.round(d.temp) + ' ℃';
    if (it.cont) {
      var names = d.contents.filter(function (c) { return c.state !== 'water'; }).slice(0, 3)
        .map(function (c) { return c.formula || c.name; });
      it.cont.textContent = names.join(' · ');
    }
    // 环境光晕
    if (it.el) {
      if (it.envName === 'furnace') it.el.style.filter = 'drop-shadow(0 0 22px rgba(255,90,30,.28))';
      else if (it.envName === 'waterbath') it.el.style.filter = 'drop-shadow(0 0 18px rgba(90,180,255,.2))';
      else it.el.style.filter = '';
    }
  }

  /* ---------------- 主循环 ---------------- */
  var lastT = 0, chemAcc = 0, paintAcc = 0, frameNo = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (!lastT) lastT = t;
    var dt = Math.min(0.08, Math.max(0.001, (t - lastT) / 1000));
    lastT = t; frameNo++;
    updateEnv();
    chemAcc += dt;
    while (chemAcc >= 0.15) {
      chemAcc -= 0.15;
      state.items.forEach(function (it) {
        if (it.kind !== 'vessel') return;
        var res = E.step(it, 0.15);
        it.ui.desc = E.describe(it);
        if (res.events.length) onEvents(it, res.events);
        ambient(it, 0.15);
      });
    }
    paintAcc += dt;
    if (paintAcc >= 0.066) {
      paintAcc = 0;
      state.items.forEach(function (it) { paintItem(it, dt); });
      if (state.sel) renderInfoSoon();
    }
    stepParticles(dt);
    if (frameNo % 18 === 0) refreshSelectedHint();
  }

  function ambient(it, dt) {
    var act = E.activeReactions(it);
    act.forEach(function (r) {
      var fx = r.fx || {};
      var gas = fx.bubbles || ruleHasGas(r);
      if (gas && Math.random() < dt * 9) spawnBubbles(it, 1 + Math.floor(Math.random() * 2));
      if (fx.precip && Math.random() < dt * 3) spawnPrecip(it, fx.precip, 1);
    });
    if (it.boiling && Math.random() < dt * 25) spawnBubbles(it, 1);
    if (it.boiling && Math.random() < dt * 12) spawnSteam(it, 1);
    if (it.ignited && Math.random() < dt * 55) spawnFlame(it, it.ui.flameColor, 1);
  }

  function refreshSelectedHint() {
    var it = state.sel ? itemById(state.sel) : null;
    if (!isVessel(it)) return;
    var hint = document.getElementById('sel-hint');
    var h = hintText(it);
    if (h) {
      hint.className = 'sel-hint warn';
      hint.innerHTML = '<b>' + esc(labelOf(it.type)) + '</b> · ' + esc(h);
    } else if (hint.className.indexOf('warn') >= 0) {
      refreshUI();
    }
  }

  /* ---------------- 交互 ---------------- */
  function benchPoint(e) {
    var r = bench.getBoundingClientRect();
    return { inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom,
      x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function itemAt(x, y) {
    for (var i = state.items.length - 1; i >= 0; i--) {
      var it = state.items[i];
      if (x >= it.x - 6 && x <= it.x + it.w + 6 && y >= it.y - 30 && y <= it.y + it.h + 8) return it;
    }
    return null;
  }

  function makeGhost(html, w, h, e) {
    var g = document.getElementById('ghost');
    g.innerHTML = html; g.style.width = w + 'px'; g.style.height = h + 'px';
    g.style.left = (e.clientX - w / 2) + 'px'; g.style.top = (e.clientY - h / 2) + 'px';
    g.hidden = false;
  }
  function hideGhost() { var g = document.getElementById('ghost'); if (g) g.hidden = true; }

  document.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    var rm = e.target.closest && e.target.closest('.rm');
    if (rm) {
      var it0 = itemById(rm.closest('.vessel').getAttribute('data-id'));
      if (it0) removeItem(it0);
      e.preventDefault();
      return;
    }
    var appar = e.target.closest && e.target.closest('.appar');
    if (appar) {
      var type = appar.getAttribute('data-appar');
      state.drag = { kind: 'appar', type: type, sx: e.clientX, sy: e.clientY, moved: false };
      makeGhost(iconSVG(type, 'g' + type), GEO[type] ? GEO[type].w * 0.7 : SOURCES[type].w * 0.7,
        GEO[type] ? GEO[type].h * 0.7 : SOURCES[type].h * 0.7, e);
      e.preventDefault();
      return;
    }
    var bottle = e.target.closest && e.target.closest('.bottle');
    if (bottle) {
      var rid = bottle.getAttribute('data-rid');
      state.drag = { kind: 'bottle', rid: rid, sx: e.clientX, sy: e.clientY, moved: false };
      var r = BYID[rid];
      makeGhost('<div class="gcap" style="background:' + (r.color || '#dfe9f2') + '"></div>', 18, 26, e);
      e.preventDefault();
      return;
    }
    var el = e.target.closest && e.target.closest('.vessel');
    if (el && layer.contains(el)) {
      var it = itemById(el.getAttribute('data-id'));
      if (!it) return;
      var p = benchPoint(e);
      state.sel = it.id;
      state.drag = { kind: 'move', id: it.id, dx: p.x - it.x, dy: p.y - it.y, sx: e.clientX, sy: e.clientY, moved: false };
      refreshUI();
      e.preventDefault();
    }
  });

  document.addEventListener('pointermove', function (e) {
    var d = state.drag;
    if (!d) return;
    if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) > 5) d.moved = true;
    if (d.kind === 'move') {
      var it = itemById(d.id);
      if (!it) return;
      var p = benchPoint(e);
      if (!p.inside) return;
      it.x = Math.max(2, Math.min(bench.clientWidth - it.w - 14, p.x - d.dx));
      var g2 = it.kind === 'source' ? (SOURCES[it.type].gap || 0) : baseGap(it);
      it.y = Math.max(2, Math.min(floorY() - it.h + g2, p.y - d.dy));
      it.el.style.left = it.x + 'px'; it.el.style.top = it.y + 'px';
    } else {
      var g = document.getElementById('ghost');
      if (g) {
        g.style.left = (e.clientX - parseFloat(g.style.width) / 2) + 'px';
        g.style.top = (e.clientY - parseFloat(g.style.height) / 2) + 'px';
      }
      var p2 = benchPoint(e);
      bench.classList.toggle('drag', p2.inside);
    }
  });

  document.addEventListener('pointerup', function (e) {
    var d = state.drag;
    if (!d) return;
    state.drag = null;
    hideGhost();
    bench.classList.remove('drag');
    var p = benchPoint(e);

    if (d.kind === 'move') {
      var moved = itemById(d.id);
      if (!d.moved && moved) { state.activatedAt = Date.now(); activateItem(moved); }
      updateEnv();
      return;
    }
    if (d.kind === 'appar') {
      if (!p.inside) { if (!d.moved) addItem(d.type); return; }
      var it = addItem(d.type, p.x - (GEO[d.type] ? GEO[d.type].w : SOURCES[d.type].w) / 2,
        p.y - (GEO[d.type] ? GEO[d.type].h : SOURCES[d.type].h) / 2);
      // 热源自动对齐到最近的仪器下方
      if (it.kind === 'source') snapSource(it, p.x);
      toast('已放入' + nameOf(d.type));
      return;
    }
    if (d.kind === 'bottle') {
      var r = BYID[d.rid];
      if (!p.inside) {
        if (!d.moved) pickBottle(d.rid);
        return;
      }
      var target = itemAt(p.x, p.y);
      if (target && isVessel(target)) {
        pourInto(target, d.rid);
      } else {
        toast('把 ' + r.name + ' 拖到仪器上再松手');
      }
      return;
    }
  });

  function activateItem(it) {
    if (!it) return;
    if (state.bottle && isVessel(it)) { pourInto(it, state.bottle); return; }
    state.sel = it.id;
    if (it.kind === 'source') {
      it.on = !it.on;
      toast(nameOf(it.type) + (it.on ? ' 已开启' : ' 已关闭'));
    }
    refreshUI();
  }

  function snapSource(src, px) {
    var best = null, bd = 1e9;
    state.items.forEach(function (it) {
      if (it.kind !== 'vessel') return;
      var d = Math.abs((it.x + it.w / 2) - px);
      if (d < bd && d < 180) { bd = d; best = it; }
    });
    if (best) {
      src.x = Math.max(2, Math.min(bench.clientWidth - src.w - 14, best.x + best.w / 2 - src.w / 2));
      src.y = floorY() - src.h + (SOURCES[src.type].gap || 0);
      src.el.style.left = src.x + 'px'; src.el.style.top = src.y + 'px';
    }
  }

  // 点击：点仪器选中/倒试剂；点热源开关；点空白取消
  layer.addEventListener('click', function (e) {
    if (state.drag) return;
    if (state.activatedAt && Date.now() - state.activatedAt < 450) return;
    var el = e.target.closest('.vessel');
    if (!el) return;
    activateItem(itemById(el.getAttribute('data-id')));
  });

  bench.addEventListener('click', function (e) {
    if (e.target.closest('.vessel')) return;
    state.sel = null;
    refreshUI();
  });

  document.getElementById('bottles').addEventListener('click', function (e) {
    var el = e.target.closest('.bottle');
    if (!el) return;
    if (state.drag) return;
    if (state.bottleAt && Date.now() - state.bottleAt < 380) return;
    var rid = el.getAttribute('data-rid');
    if (state.bottle === rid) { dropBottle(); return; }
    pickBottle(rid);
  });
  document.getElementById('kinds').addEventListener('click', function (e) {
    var el = e.target.closest('[data-kind]');
    if (!el) return;
    state.kind = el.getAttribute('data-kind'); renderKinds(); renderBottles();
  });
  document.getElementById('doses').addEventListener('click', function (e) {
    var el = e.target.closest('[data-dose]');
    if (!el) return;
    state.dose = +el.getAttribute('data-dose'); renderDoses(); updateCarry();
  });
  document.getElementById('search').addEventListener('input', function (e) {
    state.q = e.target.value; renderBottles();
  });

  document.getElementById('btn-ignite').addEventListener('click', function () {
    var it = state.sel ? itemById(state.sel) : null;
    if (!isVessel(it)) return;
    it.ignited = !it.ignited;
    if (!it.ignited) it.ui.flameColor = null;
    toast(it.ignited ? '用燃着的木条点燃了' + labelOf(it.type) : '已熄灭');
    refreshUI();
  });
  document.getElementById('btn-stir').addEventListener('click', function () {
    var it = state.sel ? itemById(state.sel) : null;
    if (!isVessel(it)) return;
    it.stir = 3;
    toast('用玻璃棒搅拌中…');
  });
  document.getElementById('btn-empty').addEventListener('click', function () {
    var it = state.sel ? itemById(state.sel) : null;
    if (!it) return;
    if (isVessel(it)) {
      E.clean(it);
      it.ui.silver = false; it.ui.flameColor = null;
      toast('已倒掉内容物');
    } else toast('条件仪器不需要倒掉');
    refreshUI();
  });
  document.getElementById('btn-clean').addEventListener('click', function () {
    var it = state.sel ? itemById(state.sel) : null;
    if (!isVessel(it)) return;
    E.clean(it); it.ui.silver = false; it.ui.flameColor = null;
    toast('已用蒸馏水洗净');
    refreshUI();
  });
  document.getElementById('btn-remove').addEventListener('click', function () {
    var it = state.sel ? itemById(state.sel) : null;
    if (it) removeItem(it);
  });
  document.getElementById('btn-clear').addEventListener('click', clearBench);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (state.modal) closeModal();
      else if (state.bottle) dropBottle();
    }
  });
  window.addEventListener('resize', function () {
    resizeCanvas();
    state.items.forEach(function (it) {
      it.x = Math.max(2, Math.min(bench.clientWidth - it.w - 2, it.x));
      var g3 = it.kind === 'source' ? (SOURCES[it.type].gap || 0) : baseGap(it);
      it.y = Math.max(2, Math.min(floorY() - it.h + g3, it.y));
      if (it.el) { it.el.style.left = it.x + 'px'; it.el.style.top = it.y + 'px'; }
    });
  });

  /* ---------------- 弹窗：反应速查 / 玩法 ---------------- */
  function openModal(title, html) {
    state.modal = true;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal').hidden = false;
  }
  function closeModal() {
    state.modal = null;
    document.getElementById('modal').hidden = true;
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target.id === 'modal') closeModal();
  });

  function reagentOptions(selected) {
    var groups = {};
    REAGENTS.forEach(function (r) { (groups[r.kind] = groups[r.kind] || []).push(r); });
    return KIND_ORDER.filter(function (k) { return groups[k]; }).map(function (k) {
      return '<optgroup label="' + esc(k) + '">' + groups[k].map(function (r) {
        return '<option value="' + esc(r.id) + '"' + (selected === r.id ? ' selected' : '') + '>' +
          esc(r.name + (r.formula ? ' · ' + r.formula : '') + ' · ' + (STATE_CN[r.state] || '')) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
  }
  var refA = 'hcl_dil', refB = 'naoh_sol';

  function openRef() {
    openModal('反应速查', '<div class="ref-row">' +
      '<select id="ref-a">' + reagentOptions(refA) + '</select>' +
      '<span class="ref-plus">+</span>' +
      '<select id="ref-b">' + reagentOptions(refB) + '</select>' +
      '<button id="ref-go" class="ref-btn" type="button">检索</button>' +
      '</div>' +
      '<div id="ref-out" class="ref-result"></div>' +
      '<p class="muted small" style="margin-top:10px">只列出“两种试剂放在一起可能发生”的规则；实际还要满足加热、催化剂等条件。检索结果可一键放到实验台。</p>');
    document.getElementById('ref-go').addEventListener('click', runRef);
    document.getElementById('ref-a').addEventListener('change', function (e) { refA = e.target.value; runRef(); });
    document.getElementById('ref-b').addEventListener('change', function (e) { refB = e.target.value; runRef(); });
    runRef();
  }
  function runRef() {
    refA = document.getElementById('ref-a').value;
    refB = document.getElementById('ref-b').value;
    var out = document.getElementById('ref-out');
    var list = E.pairRules(refA, refB);
    if (!list.length) {
      out.innerHTML = '<div class="ref-empty">这两种物质在规则库里没有直接反应。<br>可以试试加水、加热、加点催化剂，或者换一种试剂。</div>';
      return;
    }
    out.innerHTML = '<div class="meta" style="margin-bottom:2px">' + esc(BYID[refA].name + ' + ' + BYID[refB].name) + '：' + list.length + ' 条可能反应</div>' +
      list.map(function (r) {
        return '<div class="ref-card"><div class="eh"><h3>' + esc(r.name) + '</h3>' +
          '<span class="tag type">' + esc(r.type) + '</span>' +
          (r.conditions.length ? '<span class="tag cond">' + esc(r.conditions.join('、')) + '</span>' : '') + '</div>' +
          '<div class="eq">' + eqHTML(r.equation) + '</div>' +
          '<div class="meta">' + esc((r.phenomena || '').split('；')[0]) + '</div></div>';
      }).join('') +
      '<button id="ref-use" class="ref-btn" type="button" style="margin-top:4px">把这两种试剂放进烧杯</button>';
    var btn = document.getElementById('ref-use');
    if (btn) btn.addEventListener('click', function () {
      closeModal();
      var it = addItem('beaker', bench.clientWidth * 0.5, null);
      pourInto(it, 'h2o');
      pourInto(it, refA);
      pourInto(it, refB);
      toast('已放入烧杯，可继续加热或搅拌');
    });
  }

  function openDemos() {
    var cards = PRESETS.map(function (p, i) {
      return '<div class="demo-card"><h4>' + esc(p.name) + '</h4><p>' + esc(p.desc) + '</p>' +
        '<button class="ghost" type="button" data-demo="' + i + '">加载实验</button></div>';
    }).join('');
    openModal('示例实验', '<div class="demo-grid">' + cards + '</div>' +
      '<p class="muted small">加载后会清空当前台面，并把仪器、试剂和热源摆好；直接观察现象即可。</p>');
    Array.prototype.forEach.call(document.querySelectorAll('#modal-body [data-demo]'), function (b) {
      b.addEventListener('click', function () {
        var p = PRESETS[+b.getAttribute('data-demo')];
        closeModal();
        clearBench();
        setTimeout(function () {
          p.setup(); toast('已加载：' + p.name);
          if (window.innerWidth <= 900) bench.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 30);
      });
    });
  }

  var PRESETS = [
    { name: '大理石与稀盐酸', desc: '试管中加稀盐酸和大理石，观察气泡与剩余固体。', setup: function () {
      var t = addItem('testtube', bench.clientWidth * 0.42, null);
      E.addReagent(t, 'hcl_dil', { ml: 8 }); E.addReagent(t, 'caco3', { g: 2 });
      state.sel = t.id; refreshUI();
    } },
    { name: '硫酸铜与氢氧化钠', desc: '蓝色溶液生成蓝色絮状沉淀，加热可分解为黑色 CuO。', setup: function () {
      var b = addItem('beaker', bench.clientWidth * 0.42, null);
      E.addReagent(b, 'h2o', { ml: 40 }); E.addReagent(b, 'cuso4', { g: 3 }); E.addReagent(b, 'naoh_sol', { ml: 10 });
      state.sel = b.id; refreshUI();
    } },
    { name: '铁置换铜', desc: '铁片放入硫酸铜溶液，表面析出红色铜，溶液变浅绿。', setup: function () {
      var b = addItem('beaker', bench.clientWidth * 0.42, null);
      E.addReagent(b, 'h2o', { ml: 40 }); E.addReagent(b, 'cuso4', { g: 3 }); E.addReagent(b, 'fe', { g: 1 });
      state.sel = b.id; refreshUI();
    } },
    { name: '钠与水', desc: '钠浮在水面熔成小球，剧烈反应放出氢气，溶液变碱性。', setup: function () {
      var b = addItem('beaker', bench.clientWidth * 0.42, null);
      E.addReagent(b, 'h2o', { ml: 40 }); E.addReagent(b, 'na', { g: 0.3 });
      state.sel = b.id; refreshUI();
    } },
    { name: '高锰酸钾制氧气', desc: '加热高锰酸钾，紫黑色固体变黑，放出能使木条复燃的氧气。', setup: function () {
      var t = addItem('testtube', bench.clientWidth * 0.42, null);
      E.addReagent(t, 'kmno4', { g: 2 });
      var l = addItem('lamp', t.x + t.w / 2 - SOURCES.lamp.w / 2, null);
      l.on = true; state.sel = t.id; refreshUI();
    } },
    { name: '甲烷燃烧', desc: '集气瓶中甲烷与氧气被点燃，产生淡蓝色火焰和水雾。', setup: function () {
      var g = addItem('gasjar', bench.clientWidth * 0.42, null);
      E.addReagent(g, 'ch4', { ml: 250 }); E.addReagent(g, 'o2', { ml: 250 });
      g.ignited = true; state.sel = g.id; refreshUI();
    } },
    { name: '乙酸乙酯制备', desc: '乙醇、乙酸在浓硫酸催化并加热下生成有果香味的乙酸乙酯。', setup: function () {
      var t = addItem('testtube', bench.clientWidth * 0.42, null);
      E.addReagent(t, 'c2h5oh', { ml: 5 }); E.addReagent(t, 'ch3cooh', { ml: 5 }); E.addReagent(t, 'h2so4_conc', { ml: 2 });
      var wb = addItem('waterbath', t.x + t.w / 2 - SOURCES.waterbath.w / 2, null);
      wb.on = true; state.sel = t.id; refreshUI();
    } },
    { name: '葡萄糖银镜反应', desc: '葡萄糖与银氨溶液水浴加热，试管内壁出现光亮的银镜。', setup: function () {
      var t = addItem('testtube', bench.clientWidth * 0.42, null);
      E.addReagent(t, 'h2o', { ml: 5 }); E.addReagent(t, 'c6h12o6', { g: 0.5 }); E.addReagent(t, 'silver_ammonia', { ml: 3 });
      var wb = addItem('waterbath', t.x + t.w / 2 - SOURCES.waterbath.w / 2, null);
      wb.on = true; state.sel = t.id; refreshUI();
    } }
  ];

  document.getElementById('btn-demo').addEventListener('click', openDemos);
  document.getElementById('btn-ref').addEventListener('click', openRef);
  document.getElementById('btn-help').addEventListener('click', function () {
    openModal('玩法', '<div class="help">' +
      '<p><b>1. 放仪器</b>：从左上角把试管、烧杯、锥形瓶拖到台面。</p>' +
      '<p><b>2. 取试剂</b>：点试剂瓶拿起（可先选“少量/适量/足量”），再点仪器。固体需要先加水溶解；气体试剂请通入集气瓶。</p>' +
      '<p><b>3. 给条件</b>：加热用酒精灯、水浴用<b>水浴锅</b>、高温用<b>高温炉</b>、光照用<b>紫外灯</b>，都要拖到仪器旁边并点开；点燃用工具栏的“点燃”。催化剂直接用试剂（MnO₂、FeBr₃、铜丝等）。</p>' +
      '<p><b>4. 看现象</b>：气泡、沉淀、颜色、火焰、温度都会实时变化，右边记录每条反应和已反应的物质的量。</p>' +
      '<p><b>5. 多反应</b>：同一杯里可以同时发生多条反应，引擎按优先级和限量试剂结算；反应物用完就停。</p>' +
      '<p class="muted small">提示：浓硫酸入水会剧烈放热；钠先和水反应；银镜反应要水浴加热；酯化要浓硫酸并加热。</p>' +
      '</div>');
  });

  /* ---------------- 示例与初始化 ---------------- */
  function init() {
    document.getElementById('stat-reagents').textContent = REAGENTS.length;
    document.getElementById('stat-rules').textContent = LAB.rules.length;
    document.getElementById('stat-species').textContent = LAB.species.length;
    renderApparatus(); renderKinds(); renderDoses(); renderBottles(); renderLog();
    resizeCanvas();
    refreshUI();
    requestAnimationFrame(frame);
    // 开场演示：稀盐酸 + 大理石
    setTimeout(function () {
      var tt = addItem('testtube', bench.clientWidth * 0.42, null);
      E.addReagent(tt, 'hcl_dil', { ml: 8 });
      E.addReagent(tt, 'caco3', { g: 2 });
      tt.ui.desc = E.describe(tt);
      state.sel = tt.id;
      spawnPour(tt, BYID.hcl_dil);
      toast('演示：稀盐酸 + 大理石，观察气泡');
      refreshUI();
    }, 260);
  }

  /* ---------------- 测试接口 ---------------- */
  window.LabTest = {
    add: function (type, x, y) { var it = addItem(type, x, y); return it.id; },
    pour: function (vid, rid, dose) {
      var it = itemById(vid);
      if (!it) return { ok: false };
      var d = dose || doseFor(BYID[rid]);
      var res = E.addReagent(it, rid, d);
      it.ui.desc = E.describe(it);
      refreshUI();
      return res;
    },
    remove: function (id) { var it = itemById(id); if (it) removeItem(it); },
    move: function (id, x, y) { var it = itemById(id); if (!it) return; it.x = x; it.y = y; if (it.el) { it.el.style.left = x + 'px'; it.el.style.top = y + 'px'; } },
    env: function (id) { var it = itemById(id); return it ? { heat: it.envHeat, name: it.envName, light: !!it.light, temp: it.temp } : null; },
    clear: clearBench,
    ignite: function (id) { var it = itemById(id); if (isVessel(it)) { it.ignited = !it.ignited; refreshUI(); } },
    heat: function (id, temp) { var it = itemById(id); if (isVessel(it)) it.envHeat = temp == null ? 300 : temp; },
    light: function (id, on) { var it = itemById(id); if (isVessel(it)) it.light = on !== false; },
    source: function (id) { var it = itemById(id); if (it && it.kind === 'source') { it.on = !it.on; } },
    stir: function (id) { var it = itemById(id); if (isVessel(it)) it.stir = 3; },
    step: function (sec) {
      var n = Math.max(1, Math.round((sec || 1) / 0.15));
      for (var i = 0; i < n; i++) {
        state.items.forEach(function (it) {
          if (it.kind !== 'vessel') return;
          var r = E.step(it, 0.15);
          it.ui.desc = E.describe(it);
          if (r.events.length) onEvents(it, r.events);
        });
      }
      state.items.forEach(function (it) { if (it.kind === 'vessel') paintItem(it, 0.016); });
      refreshUI();
      renderLog();
      return true;
    },
    contents: function (id) { var it = itemById(id); return isVessel(it) ? E.describe(it).contents : []; },
    desc: function (id) { var it = itemById(id); return isVessel(it) ? E.describe(it) : null; },
    logs: function () { return state.logs.map(function (e) { return { id: e.rule.id, name: e.rule.name, eq: e.rule.equation, extent: e.extent, where: e.where }; }); },
    pair: function (a, b) { return E.pairRules(a, b); },
    rules: function () { return LAB.rules.length; },
    reagents: function () { return REAGENTS.length; },
    particles: function () { return particles.length; },
    selected: function () { return state.sel; },
    q: function () { return { q: state.q, kind: state.kind, n: document.querySelectorAll('.bottle').length }; },
    select: function (id) { state.sel = id; refreshUI(); return id; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
